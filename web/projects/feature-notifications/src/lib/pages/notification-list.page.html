<section class="notifications-page">
  <ui-page-title [subtitle]="'notifications.list.description' | transloco">
    {{ 'notifications.list.title' | transloco }}
    <ui-button
      uiPageTitleActions
      variant="secondary"
      [label]="'notifications.list.markAll' | transloco"
      [loading]="markingAll()"
      (pressed)="markAll()"
    />
  </ui-page-title>

  <ui-card padding="none">
    <div class="notifications-toolbar">
      <ui-field class="notifications-filter" [label]="'notifications.list.filter' | transloco">
        <ui-select
          [options]="filterOptions()"
          [value]="onlyUnread() ? 'unread' : 'all'"
          (valueChange)="changeFilter($event)"
        />
      </ui-field>
    </div>

    <ui-table
      flush
      [caption]="'notifications.list.caption' | transloco"
      [columns]="columns()"
      [rows]="store.items()"
      [labels]="tableLabels()"
      [loading]="store.loading()"
      [error]="store.error() !== null"
      [pagination]="store.pagination()"
      [trackBy]="trackById"
      (pageChange)="store.changePage($event)"
      (retry)="store.refresh()"
    >
      <ng-template uiTableCell="title" let-row>
        <span class="notifications-title" [class.notifications-title--unread]="!row.is_read">{{
          row.title
        }}</span>
        <span class="notifications-body">{{ row.body }}</span>
      </ng-template>
      <ng-template uiTableCell="created_at" let-row>
        <span class="notifications-date">{{ formatDate(row.created_at) }}</span>
      </ng-template>
      <ng-template uiTableCell="is_read" let-row>
        <ui-badge [tone]="row.is_read ? 'neutral' : 'info'">{{
          (row.is_read ? 'notifications.list.read' : 'notifications.list.unread') | transloco
        }}</ui-badge>
      </ng-template>
      <ng-template uiTableCell="actions" let-row>
        @if (!row.is_read) {
          <ui-button
            variant="ghost"
            size="small"
            [label]="'notifications.list.markRead' | transloco"
            [ariaLabel]="markReadLabel(row)"
            [loading]="busyId() === row.id"
            (pressed)="markRead(row)"
          />
        }
      </ng-template>
    </ui-table>
  </ui-card>
</section>
