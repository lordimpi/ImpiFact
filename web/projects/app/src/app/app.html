<a class="skip-link" href="#main-content" [attr.inert]="drawerOpen() ? '' : null">{{
  'app.skipToContent' | transloco
}}</a>

<!-- The shell pieces load once, the first time a page with the layout shows; prefetched while idle. -->
@defer (when layout(); prefetch on idle) {
  @if (layout()) {
    <app-sidebar
      #sidebar
      [open]="drawerOpen()"
      [collapsed]="sidebarHidden()"
      (closed)="closeDrawer($event)"
    />
    @if (drawerOpen()) {
      <div class="shell-backdrop" aria-hidden="true" (click)="closeDrawer(true)"></div>
    }
  }
}

<div
  class="shell-body"
  [class.has-layout]="layout()"
  [class.sidebar-hidden]="sidebarHidden()"
  [attr.inert]="drawerOpen() ? '' : null"
>
  @defer (when layout(); prefetch on idle) {
    @if (layout()) {
      <app-topbar
        #topbar
        [menuOpen]="drawerOpen()"
        [sidebarHidden]="sidebarHidden()"
        (toggleMenu)="toggleDrawer()"
        (toggleSidebar)="toggleSidebar()"
      />
    }
  } @placeholder {
    @if (layout()) {
      <div class="shell-topbar-placeholder"></div>
    }
  }
  <main id="main-content" class="shell-main" tabindex="-1">
    <div class="shell-content">
      <router-outlet />
    </div>
  </main>
</div>

@if (inactivityWarning(); as warning) {
  <ng-container *ngComponentOutlet="warning" />
}

<ui-toast-region
  [toasts]="toasts()"
  [labels]="{
    region: 'ui.toasts.region' | transloco,
    close: 'ui.toasts.close' | transloco,
    copy: 'ui.toasts.copy' | transloco,
    reference: 'ui.toasts.reference' | transloco,
  }"
  (dismiss)="toastStore.dismiss($event)"
  (copyReference)="copyReference($event)"
/>
