<section class="platform-page">
  <header>
    <ui-page-title
      [subtitle]="'platform.planCompanies.description' | transloco"
      [breadcrumb]="[
        { label: 'platform.plans.title' | transloco, link: '/plataforma/planes' },
        { label: title() },
      ]"
    >
      {{ title() }}
    </ui-page-title>
    <feat-platform-nav />
  </header>

  @if (notFound()) {
    <p class="platform-message platform-message--error platform-alert" role="alert">
      {{ 'platform.planCompanies.notFound' | transloco }}
    </p>
  } @else {
    <ui-card padding="none">
      <ui-table
        flush
        [caption]="'platform.planCompanies.caption' | transloco"
        [columns]="columns()"
        [rows]="rows()"
        [labels]="tableLabels()"
        [loading]="companies.isLoading()"
        [error]="!!companies.error()"
        [trackBy]="trackByNit"
        (retry)="reload()"
      >
        <ng-template uiTableCell="identification_number" let-row>{{ nit(row) }}</ng-template>
        <ng-template uiTableCell="start_plan_date" let-row>{{
          date(row.start_plan_date)
        }}</ng-template>
        <ng-template uiTableCell="state" let-row>
          <ui-badge [tone]="row.state ? 'success' : 'neutral'">{{
            (row.state ? 'platform.planCompanies.active' : 'platform.planCompanies.inactive')
              | transloco
          }}</ui-badge>
        </ng-template>
      </ui-table>
    </ui-card>
  }
</section>
