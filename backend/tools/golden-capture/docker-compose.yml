# Copia local de ApiDian (el sistema PHP original), usada solo para capturar casos de referencia:
# el XML y el CUFE/CUDE que ImpiFact debe reproducir byte a byte (ver capture.py).
# Espera el código de ApiDian clonado como carpeta hermana del repositorio: <repo>/../apidian
# nginx solo escucha en 127.0.0.1. Nunca exponga estos contenedores a la red: ApiDian tiene
# vulnerabilidades conocidas.
name: apidian-reference

services:
  db:
    image: mariadb:11.5.2
    environment:
      MARIADB_ROOT_PASSWORD: root_local_only
      MARIADB_DATABASE: db_api
      MARIADB_USER: user_api
      MARIADB_PASSWORD: password_api
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  # La configuración de nginx (apidian/docker/default.conf) espera que el servicio PHP se llame php_api.
  php_api:
    # El Dockerfile de ApiDian solo agrega poppler-utils (lectura del PDF del RUT) a esta imagen, y los
    # repositorios de paquetes (apt) que usa para instalarlo ya no existen; por eso se usa la imagen tal cual.
    image: rash07/php-fpm:8.2
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      # Clave fija, no secreta: esta instancia solo corre localmente para producir fixtures.
      APP_KEY: "base64:Z29sZGVuLWNhcHR1cmUtbG9jYWwtb25seS1rZXkhIQ=="
      APP_URL: http://localhost:8081
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: db_api
      DB_USERNAME: user_api
      DB_PASSWORD: password_api
      LOG_CHANNEL: stderr
    volumes:
      - ../../../../apidian:/var/www/html
      # vendor (las dependencias PHP que instala Composer) se guarda en un volumen administrado por
      # Docker y no en la carpeta de Windows compartida con el contenedor: descomprimir miles de
      # archivos en esa carpeta compartida es demasiado lento.
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: rash07/nginx-api
    working_dir: /var/www/html
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ../../../../apidian:/var/www/html
      - ../../../../apidian/docker/default.conf:/etc/nginx/sites-available/default
    depends_on:
      - php_api

volumes:
  dbdata:
  vendor:
