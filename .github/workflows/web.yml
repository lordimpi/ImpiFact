# Integración continua del panel Angular (docs/Arquitectura frontend.md, secciones 11, 12 y 18).
# Solo corre cuando cambia algo de web/ o este mismo archivo (CI filtrado por ruta, ADR-28).
name: web

on:
  push:
    branches: [main, develop]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["web/**", ".github/workflows/web.yml"]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # El cliente de API se genera desde el OpenAPI del backend, que exporta una herramienta de .NET.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Install
        run: npm ci

      # Regenera openapi.json y projects/api y falla si hay diferencias sin commitear: el contrato no diverge en silencio.
      - name: API client up to date
        run: npm run api:check

      # ESLint (incluye las fronteras entre librerías) y formato con Prettier.
      - name: Lint
        run: npm run lint

      # Unitarias con Vitest (ejecutor por defecto de Angular CLI) en todos los proyectos.
      - name: Unit tests
        run: npm test

      # Falla si se superan los presupuestos de bundle de angular.json.
      - name: Build
        run: npm run build

      # Las librerías siguen compilando por separado con ng-packagr.
      - name: Build libraries
        run: npm run build:libs

      # Prueba de humo E2E (de extremo a extremo) con Playwright contra ng serve.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # Lighthouse CI sobre el build de producción servido en local (sin Api): la página /login, 3 corridas, mediana.
  # Escritorio (lighthouserc.json) exige rendimiento >= 0,9 y accesibilidad >= 0,95. Móvil con 4G lento simulado
  # (lighthouserc.mobile.json) solo avisa del rendimiento y del LCP mientras no llegue a la meta de la sección 11.
  # No bloquea al principio (continue-on-error): el puntaje depende de la CPU del runner compartido y todavía no hay
  # una línea base medida en GitHub Actions; se quita cuando varias corridas seguidas den resultados estables.
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Usa el Google Chrome que trae la imagen del runner.
      - name: Lighthouse CI
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: web/lighthouse-reports
          retention-days: 7
