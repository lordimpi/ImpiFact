# Integración continua del backend .NET (Arquitectura detallada, sección 13).
# Solo corre cuando cambia algo de backend/ o este mismo archivo (CI filtrado por ruta, ADR-28).
name: backend

on:
  push:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not depend on the database engine runs once: build, OpenAPI check, unit, architecture,
  # golden and contract tests, and the vulnerability scan. Integration tests run per engine in the job below.
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -warnaserror

      # El OpenAPI del que se genera el cliente del panel (web/projects/api/openapi.json) debe estar al día con la API.
      # Si falla, ejecute `npm run api:generate` en web/ y haga commit del resultado.
      - name: OpenAPI document up to date
        run: |
          dotnet run --project tools/openapi-export -- ../web/projects/api/openapi.json
          git diff --exit-code -- ../web/projects/api/openapi.json

      # Unitarias, de arquitectura y golden (XML y CUFE comparados byte a byte con el PHP original).
      - name: Unit, architecture and golden tests
        run: dotnet test --no-build --filter "Category!=Integration&Category!=Contract"

      # Contrato: la colección Postman de ApiDian (copia en tests/ImpiFact.Contract.Tests/collection) contra la API,
      # con PostgreSQL en Testcontainers y la DIAN falsa. Escribe la tabla de resultados por carpeta.
      - name: Contract tests
        run: dotnet test --no-build --filter "Category=Contract" --logger "console;verbosity=detailed"

      # Falla si algún paquete, directo o transitivo, tiene una vulnerabilidad conocida.
      - name: Vulnerability scan
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q -E "^\s+>" vulnerable.txt; then
            echo "Vulnerable packages found."
            exit 1
          fi

  # Integration tests against a real engine in Testcontainers (the runner already has Docker). The engine is chosen
  # the same way the API, the Worker and the Migrator choose it: Database__Provider, read by TestDatabase.cs, which
  # starts postgres:18.1-alpine, mcr.microsoft.com/mssql/server:2022-latest (one shared container per run, about 2 GB)
  # or mysql:8.4 (data in tmpfs). Some behaviour exists only on one engine (for example the SQL Server outbox claim with
  # sp_getapplock), so every engine runs the whole suite. fail-fast is off: one engine failing never hides another.
  integration:
    name: integration (${{ matrix.provider }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [Postgres, SqlServer, MySql]
    env:
      Database__Provider: ${{ matrix.provider }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -warnaserror

      # Only the integration project has Category=Integration tests; targeting it keeps one TRX file per engine.
      - name: Integration tests
        run: >-
          dotnet test tests/ImpiFact.Integration.Tests --no-build
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration-${{ matrix.provider }}.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results-${{ matrix.provider }}
          path: backend/TestResults
          if-no-files-found: ignore
          retention-days: 7
