edondeo (`MidpointRounding.AwayFromZero`, 2 decimales en importes y precios, 6 en cantidades y 3 en retenciones, igual que el PHP («php-rules», sección 1)). Ningún builder redondea por su cuenta. Los casos límite viven en `ImpiFact.Golden.Tests`.\n\n## 7. Flujo de emisión (`IssueInvoice`)\n\nHandler síncrono corto + trabajo asíncrono en el Worker (ADR-02).\n\n| Paso | Quién | Detalle |\n| --- | --- | --- |\n| 1 | Api | Autentica (API key/JWT), resuelve tenant, aplica `Idempotency-Key` si viene |\n| 2 | Validación | FluentValidation del JSON; empresa activa; certificado vigente; resolución activa y en rango; cuota del plan disponible; totales validados con las reglas y tolerancias de la DIAN (`DianTotalsValidator`): se rechaza con 422 solo lo que la DIAN rechazaría |\n| 3 | Handler (transacción 1, corta) | Toma consecutivo (`INumberingSql`), crea `Document` en `Received` con cliente + snapshot, líneas, impuestos y totales (los del cliente, ya validados en el paso 2), calcula el CUFE (sin E/S) y encola `BuildDocumentXml` en el outbox; confirma. El bloqueo del consecutivo dura solo esta transacción |\n| 4 | Handler o Worker (transacción 2) | Tras confirmar (en la misma petición con `?wait=true`, o en el Worker al procesar `BuildDocumentXml`): genera UBL, firma, guarda el XML en `IBlobStorage` y `document_files` y pasa a `Queued`. Es idempotente: si el proceso cae entre 3 y 4, el mensaje `BuildDocumentXml` sigue en el outbox y el Worker reconstruye el XML desde el documento guardado, así una caída no deja huecos de numeración |\n| 5 | Handler o Worker (transacción 2) | `IOutbox.EnqueueAsync(SendDocumentToDian)` en la misma transacción del paso 4 |\n| 6 | Api | Responde de inmediato con `cufe`, número y estado `Received` (o `Queued` si el XML ya se generó en la petición); con `?wait=true` espera hasta N segundos el estado final (compatibilidad con integradores que esperan respuesta síncrona) |\n| 7 | Worker | Toma el mensaje (`SKIP LOCKED`), arma `DianContext`, envía `SendBillSync` (producción) o `SendTestSetAsync` (habilitación), guarda `dian_submissions` |\n| 8 | Worker | Según respuesta: `Accepted`/`AcceptedWithWarnings`/`Rejected`; si «En proceso» (98) o sin respuesta → `Unconfirmed` y programa `PollDianStatus` |\n| 9 | Worker | Si aceptó: genera `AttachedDocument`, PDF, guarda archivos, encola `SendEmail`, consume cuota, publica `DocumentAccepted` |\n| 10 | Worker | Regla 90 (documento ya existe): consulta el estado en la DIAN y reconcilia en vez de fallar |\n\nReglas:\n\n- El consecutivo se consume en el paso 3; si el documento termina `Failed` queda como hueco registrado.\n- Los pasos 7 a 10 son idempotentes: reintentar un mensaje no duplica archivos (`UQ document_id, kind, revision`) ni intentos (`UQ document_id, attempt`).\n- El reconsultado de `Unconfirmed` se hace cada 1 minuto durante \\~10 minutos y luego cada 15 minutos hasta 24 h; pasado ese plazo pasa a `Failed` con alerta.\n- El JSON de respuesta mantiene los campos legados (`success`, `message`, `ResponseDian`, `cufe`, `urlinvoicexml`, `urlinvoicepdf`, …); el conjunto exacto se fija con los contract tests de la colección Postman.\n- Notas crédito/débito: mismo flujo con `reference_document_id` obligatorio y validación de que el documento original esté `Accepted*` y pertenezca a la empresa.\n- Vista previa (`preeliminar-view`): valida (paso 2), arma el documento en memoria en estado `Draft` y genera UBL y PDF sin tomar consecutivo ni persistir nada; devuelve el PDF.\n- Contingencia: `invoice-contingency` emite sin enviar (`ContingencyPending`); `send_pendings` los encola.\n\n## 8. Worker\n\nProceso aparte (`ImpiFact.Worker`) con la misma imagen base que el Api y otro punto de entrada. Se puede escalar horizontalmente: el *locking* de la cola evita que dos instancias tomen el mismo mensaje.\n\n| Servicio | Intervalo | Qué hace |\n| --- | --- | --- |\n| `OutboxProcessor` | continuo (sondeo 1–5 s con espera adaptativa) | Toma mensajes `status = 0` con `next_attempt_at <= now` usando `SKIP LOCKED`/`READPAST`, los marca en proceso (`locked_until = now + 5 min`) y despacha al handler por `type`. Reintentos con retroceso: 10 s, 1 min, 5 min, 30 min, 2 h; al quinto fallo queda `Failed` y genera notificación. |\n| `DianStatusPoller` | 1 min | Reconsulta documentos `Unconfirmed` (sección 7). |\n| `ContingencySender` | 5 min | Encola `send_pendings` de documentos `ContingencyPending` cuando la DIAN vuelve a responder. |\n| `CertificateExpiryWatcher` | diario | Crea notificaciones y correo a 30, 15 y 5 días del vencimiento. |\n| `ResolutionRangeWatcher` | diario | Avisa cuando queda menos del 10 % del rango o faltan 30 días para `valid_to`. |\n| `Housekeeping` | diario | Purga `outbox_messages` hechos con más de 30 días, `idempotency_keys` vencidas y `refresh_tokens` expirados; mueve `request`/`response` antiguos a almacenamiento frío si se configura. |\n\nCada mensaje del outbox lleva `company_id`; el Worker lo establece en `ITenantContext` antes de ejecutar el handler. Un fallo de un tenant nunca detiene el procesamiento de los demás.\n\n## 9. Capa API\n\n### 9.1 Pipeline (orden de middleware)\n\n1. `ForwardedHeaders` (detrás de proxy/ingress).\n2. `CorrelationId` (acepta `X-Correlation-Id` o genera uno; entra al contexto de Serilog).\n3. `ExceptionHandler` → `ProblemDetails` (RFC 9457) más los campos legados `success` y `message`.\n4. `HttpsRedirection`, `HSTS`, CORS con lista explícita.\n5. `RateLimiter` (por API key, por IP y más estricto en login).\n6. `Authentication` → `TenantResolution` → `Authorization`.\n7. Endpoints.\n\n### 9.2 Autenticación\n\n- **Esquema de política** que decide por el encabezado `Authorization: Bearer <token>`: si el token empieza por `apk_` es API key; si no, JWT. Así el Postman legado (que usa Bearer) funciona sin cambios.\n- **API key**: se busca por `key_hash` (SHA-256), se verifica `revoked_at`/`expires_at`, se actualiza `last_used_at` (sin bloquear la petición) y se crean los claims `company_id` y `scopes`.\n- **JWT** del panel: vida 15 min, refresh de 14 días rotativo (`refresh_tokens`), claims `sub`, `role` y `company_id` activa; cambiar de empresa emite un token nuevo.\n- **Plataforma**: llave con `company_id` nulo y alcance `platform:*` reemplaza `X-Admin-Token` para crear/borrar empresas, planes y revendedores.\n- **Propiedad por NIT**: toda ruta con `{nit}` o con NIT en el cuerpo compara contra la empresa del token; si no coincide responde 403 sin revelar si el NIT existe.\n- Políticas de autorización por alcance (`documents:write`, `documents:read`, `config:write`, `platform:*`) y por rol en el panel. Los usuarios del panel reciben sus alcances según sus roles al emitir el JWT (16-nov), en claims `scope`, así las mismas políticas sirven para usuarios y API keys: `owner` → `documents:read`, `documents:write` y `config:write`; `seller` → `documents:read` y `documents:write`; `customer` → `documents:read`; `platform_admin` → `platform:*`; `reseller` → ninguno por ahora. Los alcances de empresa solo se dan con empresa activa en el token y `platform:*` solo sin empresa activa.\n\n### 9.3 Endpoints\n\n- Estilo *Minimal API* agrupado por módulo (`MapGroup`), un archivo por caso de uso o por grupo pequeño; cada endpoint solo valida la forma HTTP, llama al handler y traduce el `Result`.\n- Rutas: `/api/v1/...` es la ruta canónica (la usa el panel). Las del contrato legado (`/api/ubl2.1/...`, `/api/information/...`, `/api/table/...`, etc., ver anexo A) se publican como alias del mismo handler para los contract tests.\n- Los DTO de entrada replican los nombres JSON del contrato (`[JsonPropertyName]`) incluyendo los typos heredados.\n- Documentación con `Microsoft.AspNetCore.OpenApi` y Scalar en `/scalar` (solo en desarrollo y staging, protegido en producción).\n\n### 9.4 Mapeo de errores\n\n| `ErrorType` | HTTP | Notas |\n| --- | --- | --- |\n| `Validation` | 422 | `errors` por campo; `success: false` |\n| `NotFound` | 404 |  |\n| `Conflict` | 409 | consecutivo en uso, documento duplicado |\n| `Unauthorized` | 401 |  |\n| `Forbidden` | 403 | NIT ajeno, alcance insuficiente |\n| `DianRejected` | 422 | incluye el detalle de reglas rechazadas por la DIAN |\n| `Unavailable` | 503 | DIAN o almacenamiento no disponibles; `Retry-After` |\n| `Unexpected` | 500 | sin detalles internos; el `correlation_id` va en la respuesta |\n\nEl PHP respondía muchos errores con 200 y `success: false`. Los errores de validación, en cambio, salen como HTTP 500 con `success: false` y sin detalle por campo («php-rules», sección 3.1); ImpiFact responde 422. El contract test fija cuáles casos deben conservar el comportamiento del PHP por compatibilidad, **\\[verificar\\]** contra la colección.\n\n### 9.5 Archivos y descargas\n\n- Las rutas de descarga legadas (`download/{nit}/{archivo}`, `invoice/{nit}/{pdf}`, `receivedfile/...`) exigen autenticación y propiedad del NIT, o aceptan un token de URL firmada con vencimiento. Ya no existen rutas públicas adivinables.\n- `config/certificate` (GET) **no se implementa**; se reemplaza por consulta de metadatos (`certificates-listing`).\n\n## 10. Panel Angular (`web/`)\n\n- Angular (última versión estable), componentes *standalone*, `signals`, control flow nativo (`@if`, `@for`), `provideRouter` con rutas perezosas por `feature`.\n- Cliente HTTP **generado** desde el OpenAPI del Api (`ng-openapi-gen` u OpenAPI Generator `typescript-angular`, con servicios sobre `HttpClient`); no se escriben interfaces de API a mano.\n- Estructura: workspace con librerías `core`, `ui`, `api` y una librería por *feature* (`feature-auth`, `feature-documents`, …). El detalle está en «Arquitectura frontend» sección 2, que manda sobre esta sección.\n- Interceptores: token JWT, renovación con refresh, manejo global de `ProblemDetails`, `X-Correlation-Id`.\n- Guards por rol (`owner`, `seller`, `customer`, `reseller`, `platform_admin`) y por empresa activa.\n- UI: componentes accesibles (WCAG AA), tablas con paginación por servidor, formularios reactivos tipados, `i18n` con español como idioma base.\n\nMódulos del panel de la fase 5:\n\n| Feature | Pantallas |\n| --- | --- |\n| `auth` | login, recuperar contraseña, selector de empresa |\n| `companies` | alta de empresa, datos, ambientes, software, certificado, resoluciones, correo, logo, plantilla PDF |\n| `production-wizard` | asistente por pasos (empresa → certificado → resolución → set de pruebas → producción por producto) |\n| `documents` | listado con filtros, detalle, descarga XML/PDF, reenvío de correo, regenerar PDF, vista previa; eventos RADIAN al llegar la fase 7 |\n| `masters` (clientes y productos) | CRUD con búsqueda |\n| `api-keys` | crear (se muestra una vez), revocar, rotar |\n| `plans` | plan activo, consumo, vencimiento |\n| `platform` (reseller/admin) | empresas, planes, revendedores |\n| `notifications` | campana, certificado por vencer, rangos, rechazos |\n\n## 11. Configuración\n\n`appsettings.json` solo trae valores no secretos. Los secretos entran por variables de entorno o por el proveedor de secretos de la nube.\n\n```jsonc\n{\n  \"Database\":   { \"Provider\": \"Postgres\", \"ConnectionString\": \"\" },        // Postgres | SqlServer | MySql\n  \"Dian\":       { \"HabilitacionUrl\": \"https://vpfe-hab.dian.gov.co/WcfDianCustomerServices.svc\",\n                  \"ProduccionUrl\":   \"https://vpfe.dian.gov.co/WcfDianCustomerServices.svc\",\n                  \"TimeoutSeconds\": 60 },\n  \"Storage\":    { \"Provider\": \"Local\", \"Local\": { \"Root\": \"/data\" },    // Local | AzureBlob | S3 | Gcs\n                  \"AzureBlob\": { \"Container\": \"impifact\" }, \"S3\": { \"Bucket\": \"\", \"Region\": \"\" }, \"Gcs\": { \"Bucket\": \"\" } },\n  \"Secrets\":    { \"Provider\": \"LocalAesGcm\", \"KeyVaultUri\": \"\", \"AwsRegion\": \"\", \"GcpProject\": \"\" },\n  \"Jwt\":        { \"Issuer\": \"impifact\", \"Audience\": \"impifact-web\", \"AccessMinutes\": 15, \"RefreshDays\": 14 },\n  \"ApiKey\":     { \"Prefix\": \"apk_\" },\n  \"Outbox\":     { \"PollSeconds\": 2, \"LockMinutes\": 5, \"MaxAttempts\": 5 },\n  \"Resilience\": { \"Retries\": 3, \"BreakerFailures\": 5, \"BreakerSeconds\": 30 },\n  \"Cors\":       { \"Origins\": [ \"https://app.example.com\" ] },\n  \"RateLimit\":  { \"PermitPerMinutePerKey\": 120, \"PermitPerMinutePerIp\": 300, \"LoginPerMinute\": 10 },\n  \"Pdf\":        { \"DefaultTemplate\": 2 },\n  \"Serilog\":    { /* niveles y sinks */ }\n}\n```\n\n- Secretos (cadena de conexión, llave de JWT, llave maestra local, credenciales SMTP por defecto) **nunca** van en `appsettings`; el arranque falla (`ValidateOnStart`) si falta alguno.\n- Llave de JWT: asimétrica (RS256/ES256) con rotación; la pública se expone en `/.well-known/jwks.json` si se necesita.\n- Archivos de ejemplo `appsettings.Development.json` y `.env.example` se versionan sin secretos.\n\n## 12. Observabilidad\n\n- **Logs**: Serilog con salida JSON a consola; enriquecedores `CorrelationId`, `CompanyId`, `UserId`, `RequestPath`. Se filtran encabezados `Authorization` y cualquier campo `*password*`, `*token*`, `*pin*`.\n- **Trazas y métricas**: OpenTelemetry (ASP.NET, HttpClient, EF Core) exportando por OTLP; funciona con Azure Monitor, CloudWatch/X-Ray o Cloud Trace mediante el *collector*.\n- **Métricas de negocio**: documentos emitidos por tipo y estado, latencia de la DIAN, tamaño de cola del outbox, reintentos, documentos `Unconfirmed`, días al vencimiento de certificados.\n- **Health checks**: `/health/live` (proceso) y `/health/ready` (BD, almacenamiento, proveedor de secretos); la DIAN se reporta como degradado, no como caído.\n- **Alertas sugeridas**: cola > 100 mensajes por más de 5 min, > 5 % de rechazos en 15 min, circuit breaker abierto, certificado a < 15 días.\n\n## 13. Pruebas\n\n| Proyecto | Qué verifica | Notas |\n| --- | --- | --- |\n| `Domain.Tests` | Reglas del agregado `Document`, transiciones, `Resolution.TakeNumber`, `DianRounding` | Rápidas, sin I/O |\n| `Application.Tests` | Handlers con puertos simulados (Moq) | Caminos felices y de error |\n| `Dian.Tests` | CUFE, firma, UBL contra fixtures | Sin red |\n| `Golden.Tests` | JSON de entrada → XML y CUFE idénticos al PHP | Comparación byte a byte (ADR-27); fixtures en `backend/tests/golden/<tipo>/<caso>/{input.json,expected.xml,expected.cufe}` |\n| `Integration.Tests` | EF + Dapper + cola con Testcontainers en PostgreSQL (fase 2) y en los 3 motores desde la fase 6 | Matriz de proveedor en CI desde la fase 6 |\n| `Contract.Tests` | Colección Postman (Newman) contra el Api levantado | Tokens propios; falla ante cambios de contrato |\n| `Architecture.Tests` | Reglas de la sección 1, aislamiento de módulos, consultas Dapper con `company_id`, ausencia de secretos en logs | NetArchTest |\n| Seguridad | Aislamiento entre empresas por entidad, API keys revocadas, propiedad por NIT | En `Integration.Tests` |\n\nProcedimiento para generar fixtures golden: `backend/tools/golden-capture` levanta el PHP en Docker (solo en `127.0.0.1`) y le envía cada JSON de entrada con `\"query_uuid\": true`. En ese modo el PHP arma, firma y calcula el CUFE/CUDE, pero responde antes de llamar a la DIAN; no sale tráfico hacia la DIAN. Guarda el XML firmado sin el elemento `ds:Signature`, el CUFE y la respuesta, y se versionan en el repo. Fecha, hora, consecutivo, clave técnica, software y empresa son fijos, así que el resultado es determinista (comprobado el 15-nov: dos corridas dan los mismos bytes). Instrucciones en `backend/tools/golden-capture/README.md`.\n\nCobertura mínima exigida en CI: `Domain` y `Dian` 90 %, `Application` 80 %; los golden tests no se pueden desactivar.\n\n## 14. Despliegue\n\n- Imágenes: `Dockerfile.api`, `Dockerfile.worker`, `Dockerfile.web` (Nginx con el build de Angular), multi-etapa, usuario no root, sin secretos en capas.\n- `docker-compose.yml` para desarrollo: Postgres, SQL Server, MySQL (perfiles), Azurite/MinIO para blobs, MailHog para correo, Api, Worker y web.\n- CI (GitHub Actions): restaurar → compilar con `TreatWarningsAsErrors` → pruebas unitarias → integración (PostgreSQL; matriz de motores desde la fase 6) → golden → contract → análisis de vulnerabilidades → imágenes.\n- Migraciones se aplican con `ImpiFact.Migrator` como paso previo al despliegue (job de Kubernetes, tarea ECS, job de Cloud Run o contenedor de inicio en Azure Container Apps).\n\n| Necesidad | Azure | AWS | GCP |\n| --- | --- | --- | --- |\n| Cómputo | Container Apps / AKS | ECS Fargate / EKS | Cloud Run / GKE |\n| Base de datos | Azure Database for PostgreSQL, Azure SQL, MySQL Flexible | RDS PostgreSQL/SQL Server/MySQL | Cloud SQL (los 3) |\n| Blobs | Blob Storage | S3 | Cloud Storage |\n| Secretos y certificados | Key Vault | Secrets Manager (+ KMS) | Secret Manager |\n| Observabilidad | Application Insights / Monitor | CloudWatch / X-Ray | Cloud Logging / Trace |\n| Identidad de carga de trabajo | Managed Identity | IAM role del task | Service account |\n\nLas implementaciones de `IBlobStorage` y `ICertificateStore` usan la identidad de la carga de trabajo, sin llaves estáticas. Una instalación mínima (Docker en un servidor) usa Local + `LocalAesGcm` con la llave maestra montada como secreto.\n\n## 15. Decisiones adicionales (ADR)\n\n| ID | Decisión | Resolución |\n| --- | --- | --- |\n| ADR-09 | SOAP: cliente `WCF (System.ServiceModel) o sobre manual con HttpClient` | Spike en la fase 1b: cliente WCF (System.ServiceModel) frente a sobre SOAP manual; gana el que logre aceptación de la DIAN. Ambos van detrás de IDianClient |\n| ADR-10 | Casos de uso: handlers propios con decoradores (Scrutor) | Aprobado (sin MediatR) |\n| ADR-11 | Minimal API agrupada por módulo frente a controladores | Minimal API |\n| ADR-12 | Autenticación dual con un solo encabezado `Bearer` y prefijo `apk_` | Aprobado, mantiene el contrato Postman |\n| ADR-13 | Envío asíncrono con `?wait=true` opcional | Aprobado (refina ADR-02) |\n| ADR-14 | Cliente Angular generado desde OpenAPI | Aprobado |\n\n## 16. Reglas de desarrollo\n\nConvenciones que sigue todo el código del repositorio. Los documentos de `docs/` mandan: si el código los contradice, gana el documento; si el documento está mal, se corrige el documento antes de desviarse. La configuración local de herramientas de desarrollo no se versiona (ver `.gitignore`).\n\n**Reglas**\n\n- Idioma (15-nov): comentarios y documentación XML (`///`) en español neutro y profesional; identificadores, nombres de pruebas, mensajes de excepción y registros en inglés, como es convención en .NET.\n- Claridad (15-nov): los comentarios explican qué hace el código y por qué, en palabras simples, para alguien que no conoce las normas de firma XML ni la DIAN. Ninguna sigla ni término técnico sin explicar la primera vez que aparece en cada archivo (por ejemplo, «canonicalización (C14N): escribir el XML de forma estándar para que el mismo contenido dé siempre los mismos bytes»); los nombres oficiales (CUFE, UBL, XAdES) se conservan y se explican.\n- Ramas (16-nov): `develop` es la rama de integración y `main` solo recibe versiones. Cada cambio sale de `develop` en una rama con prefijo de Conventional Commits (`feat/`, `fix/`, `docs/`, `test/`, `refactor/`, `chore/`) y vuelve a `develop`; `main` se actualiza desde `develop` al cerrar una fase, con una etiqueta de versión.\n- Escrituras (16-nov): toda fila de empresa se escribe por el `DbContext` y `SaveChanges`, que aplican la guardia por empresa, `created_at`/`updated_at` y `row_version`. No se usan `ExecuteUpdate` ni `ExecuteDelete` sobre entidades auditadas o de borrado lógico: saltan esos interceptores. Un caso de uso no llama a otro comando decorado: la transacción es una por solicitud.\n- .NET 10, C# con `Nullable` y `TreatWarningsAsErrors`.\n- Clean Architecture: `Domain` sin dependencias, `Application` solo con puertos y `Dian` puro. Las pruebas de arquitectura deben pasar.\n- Sin MediatR ni AutoMapper. Casos de uso con `IHandler<TIn, TOut>` y decoradores; mapeo con Mapster.\n- Escrituras con EF Core y lecturas con Dapper. Toda consulta incluye `company_id`.\n- Dinero con `decimal` y `DianRounding`; nunca `float` ni `double`.\n- Ningún secreto en logs, `appsettings` ni base de datos en claro.\n- Migraciones por proveedor; no se editan migraciones ya aplicadas.\n- Una tarea es un PR pequeño con sus pruebas. No se avanza de fase sin cumplir su puerta de salida.\n\n**Comandos**\n\n- `dotnet build -warnaserror`\n- `dotnet test --filter Category!=Integration`\n- `dotnet test --filter Category=Integration` (requiere Docker)\n- `dotnet ef migrations add <Nombre> -p src/ImpiFact.Infrastructure.Postgres -s src/ImpiFact.Api`\n\n**Cuando falte información de la DIAN:** la tarea se marca como bloqueada, se deja un TODO con el identificador [verificar] del documento y se sigue con lo que no dependa de ella.\n\n## 17. Backlog inicial por fase\n\nCada tarea es un PR con pruebas. Entre paréntesis, la puerta de salida de la fase (PRD sección 12).\n\n**Fase 0 — Documentación (aprobar PRD)**\n\n- Resolver los [verificar] que no dependan de la DIAN: hecho el 14-nov en `docs/php-rules.md` (razón social, `state_document_id` y validación de `number`).\n- Extraer las semillas de catálogos a `Seed/*.json`.\n- Extraer del anexo técnico de la DIAN las reglas de validación de totales y sus tolerancias (base de `DianTotalsValidator`), con un caso de prueba por regla.\n- Capturar con el PHP casos golden de nota crédito y débito, y 10 de factura (venta, descuentos, impuestos, moneda extranjera, redondeo). Hecho el 15-nov: 14 casos en `backend/tests/golden`.\n\n**Fase 1 — Prototipo DIAN** *(1a sin DIAN: tareas 1, 2 y 4 con un certificado de prueba propio. 1b con certificado y `testSetId` reales: tarea 3 y aceptación de la DIAN)*\n\n1. `ImpiFact.Dian`: `InvoiceUblBuilder` + `CufeCalculator` + `DianRounding` con 10 casos golden en verde (no requiere DIAN).\n2. `XmlSigner` XAdES-EPES con un certificado de prueba propio; validar la firma con una librería independiente.\n3. `SoapClient` WS-Security con `SendTestSetAsync`/`GetStatus` contra habilitación (requiere credenciales).\n4. Consola de prueba `ImpiFact.Prototype` (proyecto temporal en `backend/tools/`, fuera de la solución final) que emite una factura de ejemplo extremo a extremo.\n\n**Fase 2 — Base** *(pruebas de arquitectura y aislamiento en verde)*\n\n1. Solución, proyectos, `Directory.*.props`, CI y `docker-compose`.\n2. `Result`, `IHandler`, decoradores, `Error`, `IClock`, `ITenantContext`.\n3. `DbContext`, convenciones `snake_case`, conversores (JSON, `DateTimeOffset`), interceptores, `UnitOfWork`.\n4. Migración inicial en PostgreSQL con el modelo completo; semillas.\n5. `Identity`: usuarios, roles, JWT, API keys, middleware de tenant.\n6. `Company`: crear empresa, ambientes, software, resoluciones, certificado (`LocalAesGcm`).\n7. `DianOptions` validado al arrancar (sección 4.3), con las URLs del servicio y del QR por ambiente (sección 6.4); las URLs del QR salen de `InvoiceUblBuilder` y entran por el modelo de entrada de `ImpiFact.Dian`.\n8. Pruebas de arquitectura y de aislamiento multi-tenant.\n\n**Fase 3 — Documentos** *(golden: XML y CUFE idénticos al PHP)*\n\n1. `IssueInvoice` + `NumberingSequence` + persistencia + outbox.\n2. Notas crédito y débito.\n3. Consultas: listado, detalle, por CUFE, `information`, `total_documents`.\n\n**Fase 4 — Operación** *(peticiones Postman de la primera entrega en verde)*\n\n1. Worker: `OutboxProcessor`, `DianStatusPoller`, reintentos y reconciliación (regla 90).\n2. `AttachedDocument`, PDF con plantillas, correo por empresa, almacenamiento (Local y una nube).\n3. `regenerate-attached-document` y `regeneratepdf`.\n4. Planes y consumo.\n\n**Fase 7 — Paridad y salida** *(piloto en producción y colección Postman Community completa en verde)*\n\n1. Piloto con una empresa real usando la primera entrega.\n2. Variantes de factura: exportación, contingencia, AIU, mandato, transporte.\n3. Documento soporte y su nota de ajuste.\n4. Eventos RADIAN y lotes.\n\n**Fases 5, 6 y 8** como en el PRD; se desglosan al cerrar la fase 4.\n\n## 18. Definición de terminado (cualquier tarea)\n\n1. Compila sin advertencias y pasa las pruebas relevantes.\n2. Pruebas de arquitectura en verde.\n3. Sin secretos, `TODO` sin dueño ni código muerto.\n4. Documenta en `docs/` cualquier decisión que se aparte del PRD (nuevo ADR) en el mismo PR.\n5. Si toca la BD: migración para PostgreSQL con su prueba de integración; desde la fase 6, para los tres proveedores en la matriz.\n\n## 19. Adiciones tras la revisión crítica\n\n### 19.1 Colas y caché (ADR-22)\n\n- La cola es `outbox_messages` (sección 8). **No hay Redis, RabbitMQ ni Kafka en la v1.** `IOutbox` es la única puerta de entrada, así que un transporte externo se puede agregar después como un relevo que lee del outbox, sin tocar los casos de uso.\n- Caché: `HybridCache` con nivel local en memoria. Se cachean catálogos (TTL largo, invalidados al aplicar migraciones de datos) y la búsqueda de API keys por hash (TTL de 60 s; una llave revocada deja de servir como máximo en ese tiempo, y la revocación también limpia la entrada local de la instancia que la ejecuta).\n- Limitación de tasa: `RateLimiter` de ASP.NET en memoria por instancia. Con más de una instancia se mueve al *gateway* de la nube (API Management, API Gateway, Cloud Endpoints) o se usa Redis como almacén compartido; se decide cuando exista esa topología.\n- No se necesitan bloqueos distribuidos: la exclusión sale de la base (`SKIP LOCKED`, `UPDATE` atómico del consecutivo).\n\n### 19.2 Llaves de Data Protection\n\n`ISecretProtector` usa ASP.NET Data Protection. Con más de una instancia (o tras reiniciar un contenedor) las llaves deben ser compartidas y persistentes, o los campos `*_cipher` quedan ilegibles.\n\n- Tabla `data_protection_keys (id int identity PK, friendly_name varchar(200), xml text)` en el módulo `Platform` (`PersistKeysToDbContext`).\n- Las llaves se cifran con un certificado o con la llave del proveedor de secretos (`ProtectKeysWithAzureKeyVault`, KMS o equivalente); en instalación mínima, con la llave maestra local.\n- Rotación automática cada 90 días; las llaves antiguas se conservan para poder descifrar.\n- Prueba de integración: cifrar con una instancia y descifrar con otra que comparta la base.\n\n### 19.3 Copias de seguridad y recuperación\n\n- Base de datos: recuperación a un punto en el tiempo (PITR) activada en el servicio administrado; objetivos propuestos RPO 15 min y RTO 4 h.\n- Blobs: versionado y *soft delete* activados; los XML aceptados por la DIAN no se borran.\n- Certificados: en el proveedor de secretos con protección contra purga; copia cifrada y fuera de línea que guarda el propietario de la empresa.\n- Prueba de restauración documentada cada trimestre.\n\n### 19.4 Retención y datos personales\n\n- Conservación de XML, PDF y respuestas de la DIAN durante el plazo legal de conservación de documentos electrónicos **\\[verificar el plazo vigente con la DIAN o un asesor\\]**; política de ciclo de vida: almacenamiento frío después de 1 año, sin borrado automático dentro del plazo.\n- Datos personales de clientes finales (nombre, identificación, dirección, correo): tratamiento conforme a la Ley 1581 de 2012 **\\[verificar con un asesor\\]**; aviso de privacidad y política de tratamiento en el panel, registro de quién accede (`audit_logs`) y logs sin datos personales.\n- Un cliente sin documentos emitidos se puede suprimir; con documentos, se anonimiza lo no exigido por el XML ya emitido.\n\n### 19.5 Cambios al backlog\n\n- **Fase 0, tareas nuevas:** `docs/php-rules.md` (inventario de reglas por tipo de documento); levantar el PHP de referencia con su `Dockerfile` y correr `composer install` dentro del contenedor (la máquina de desarrollo no tiene PHP ni Composer) y, si falla, definir el plan B de fixtures; consulta regulatoria sobre proveedor tecnológico; decidir el nombre del producto y los namespaces.\n- **Fase 1 dividida:** **1a** sin DIAN (UBL, CUFE, firma con certificado de prueba, golden tests) y **1b** con certificado y `testSetId` reales (SOAP y aceptación). La 1a se hace antes de la fase 2; la 1b cuando haya credenciales.\n- **Fase 2:** agregar `data_protection_keys`, `HybridCache` y la prueba de llaves compartidas.\n- **Contract tests:** en la fase 4 solo se ejecutan las peticiones de la primera entrega (carpetas 01 a 06, 09 y 10, sin documento soporte, contingencia ni lotes); en la fase 7 se suman la 07, la 08 y esas peticiones. Nunca se ejecutan `payroll`, `payroll-adjust-note`, `eqdoc`, `send-email-employee` ni las carpetas 11 a 14.\n- **Criterios de aceptación del modelo:** las pruebas de los tres motores se exigen en la fase 6; en la fase 2 solo PostgreSQL.\n\n### 19.6 ADR nuevos\n\n| ID | Decisión | Resolución |\n| --- | --- | --- |\n| ADR-22 | Redis y brokers | Sin ellos en la v1; outbox en BD; se reabre con los casos de la sección 19.1 |\n| ADR-23 | Puertos de la DIAN | Definidos e implementados en `ImpiFact.Dian`; `Application` los consume |\n| ADR-24 | Transacciones de emisión | Transacción 1 corta (consecutivo, documento, CUFE y mensaje `BuildDocumentXml`) y transacción 2 (XML, firma, estado `Queued` y mensaje `SendDocumentToDian`) |\n| ADR-25 | Llaves de Data Protection | Persistidas en BD y protegidas por el proveedor de secretos |\n| ADR-26 | Entrada de los generadores UBL (15-nov) | `ImpiFact.Dian` define su propio modelo de entrada con los códigos de catálogo ya resueltos y no referencia a `Domain`; `Application` hace el mapeo. Así el núcleo DIAN se prueba solo, sin base de datos ni dominio |\n| ADR-28 | Organización del repositorio (15-nov) | Monorepo con una carpeta por aplicación: `backend/` (.NET), `web/` (Angular) y `mobile/` (fase 8). Se descartaron `apps/` + `libs/` estilo Nx (el backend y el panel no comparten código) y los repos separados (más trabajo para una persona y el cliente del API se genera desde el OpenAPI del backend) |\n| ADR-27 | Librerías de pruebas (15-nov) | Aserciones de NUnit, sin FluentAssertions: desde la versión 8 tiene licencia comercial de pago. Los golden se comparan byte a byte con un mensaje que muestra la primera línea distinta, sin Verify |\n"}, {"id": "datos", "label": "Modelo de datos", "file": "Modelo de datos detallado.md", "markdown": "# Modelo de datos detallado\n\nEste documento es la especificación de implementación del modelo. Parte del esquema real del PHP (134 migraciones del repo Community) y lo reemplaza por un modelo limpio, multi-tenant y portable a PostgreSQL, SQL Server y MySQL. Donde algo no se pudo confirmar en el código origen se marca **\\[verificar\\]** y se resuelve con los golden tests.\n\n## 1. Principios\n\n1. **Un modelo lógico, tres proveedores.** Las entidades y configuraciones EF son idénticas; solo cambian los tipos físicos y unos pocos índices (sección 8).\n2. **Todo dato de negocio lleva `company_id`.** Las FKs entre tablas de tenant son compuestas `(company_id, id)` para que una fila no pueda apuntar a otra empresa.\n3. **Catálogos DIAN con los mismos ids numéricos que el PHP.** El contrato JSON envía `type_document_id: 1`, `tax_id: 1`, etc., así que los ids se siembran explícitos y no se autogeneran.\n4. **Nada de blobs ni secretos en filas calientes.** XML, PDF, solicitud y respuesta de la DIAN van a `IBlobStorage`; certificados y claves a `ICertificateStore`/cifrado de aplicación.\n5. **Dinero y cantidades en `decimal` exacto**, nunca `float`. El PHP mezcló `float(10,2)`, `decimal(10,2)` y `decimal(18,2)` en `documents`; aquí hay un solo estándar.\n6. **Sin `ON DELETE CASCADE` hacia datos fiscales.** Los documentos emitidos no se borran: se anulan con nota o se marcan `deleted_at` (borrado lógico solo para entidades administrativas; las vistas previas no se persisten).\n7. **Fechas en UTC** (`DateTimeOffset` en código). La fecha/hora de emisión del documento se guarda como instante UTC y además `issue_date`/`issue_time` en hora Colombia (UTC-5) porque eso es lo que va al XML.\n\n## 2. Convenciones\n\n| Tema | Regla |\n| --- | --- |\n| Nombres | `snake_case` en tablas y columnas, tablas en plural. Se aplica con una convención global de EF (no a mano). Los catálogos conservan el nombre del PHP (`type_documents`, `taxes`, …) para que `/table/*` mapee 1:1. |\n| Claves de tenant | `id uuid` (v7, generado en la aplicación). |\n| Claves de catálogo | `id int` explícito (los de la DIAN/PHP). |\n| Claves de alto volumen sin exposición externa | `bigint identity` (`audit_logs`). |\n| Columnas comunes en tablas de tenant | `company_id uuid not null`, `created_at ts not null`, `updated_at ts not null`, `row_version bigint not null` (concurrencia optimista; la incrementa un interceptor de `SaveChanges`, igual en los 3 motores). |\n| Borrado lógico | Solo donde se indica con `deleted_at ts null`; filtro global EF. |\n| Texto normalizado | Se guarda normalizado y se compara ordinal: NIT solo dígitos, email en minúsculas, prefijo en mayúsculas, CUFE/CUDE en hex minúsculas. Así no se depende de la collation de cada motor. |\n| Booleanos | `bool` real; el PHP usaba `tinyint`. |\n| Enums | `smallint` con enum C#; tabla de referencia solo si el panel la necesita. |\n| JSON | Solo para datos que no se consultan por campo (snapshots, extensiones). Si se consulta por campo, es columna. |\n| Nombres de índices | `ix_<tabla>_<cols>`, `ux_<tabla>_<cols>`, `fk_<hija>_<padre>`, `ck_<tabla>_<regla>`. |\n\n### Tipos lógicos\n\n`uuid`, `int`, `smallint`, `bigint`, `bool`, `varchar(n)`, `text`, `date`, `ts` (instante UTC), `numeric(p,s)`, `json`, `bytes`. La tabla de la sección 8 da el tipo físico por motor.\n\n- Importes de documento: `numeric(18,2)`.\n- Precio unitario y cantidades: `numeric(18,6)`.\n- Porcentajes y tarifas: `numeric(9,4)`.\n- CUFE/CUDE/CUNE: `varchar(96)` (SHA-384 en hex).\n\n## 3. Módulos y tablas\n\nNotación: `columna tipo [null] — nota`. `PK`, `FK`, `UQ`, `IX`, `CK` indican restricciones. Las columnas comunes de la sección 2 se omiten salvo que cambien.\n\n### 3.1 Catálogos DIAN (módulo `Catalog`)\n\nTodas estas tablas comparten la forma base, con las columnas extra indicadas:\n\n```\n<catalogo>\n  id            int       PK      — id explícito, igual al del PHP\n  code          varchar(20) not null  — código DIAN\n  name          varchar(255) not null\n  is_active     bool not null default true\n  valid_from    date null           — vigencia DIAN (nuevo)\n  valid_to      date null\n  UQ ux_<catalogo>_code (code)  — salvo municipalities, unit_measures, type_operations, countries y languages (ver abajo)\n```\n\n| Tabla (origen PHP) | Extras |\n| --- | --- |\n| `type_documents` | `cufe_algorithm varchar(16) null` (`CUFE-SHA384` tiene 11 caracteres), `prefix varchar(10) null`. El PHP tiene 14 filas (ids 1–14); el id 6 (ZIP) tiene `code` vacío, que no es nulo. |\n| `taxes` | `description varchar(255)`. El id 15 es «ZZ» (no aplica); el PHP corrigió su nombre en 3 migraciones, se siembra ya corregido. |\n| `type_regimes`, `type_organizations`, `type_liabilities`, `type_environments`, `type_currencies`, `unit_measures`, `type_operations`, `type_discounts`, `discounts`, `reference_prices`, `payment_forms`, `payment_methods`, `type_rejections`, `events`, `incoterms`, `prepaid_payment_types`, `type_generation_transmitions`, `type_spds`, `languages` | solo forma base |\n| `type_document_identifications` | `rips_code varchar(10) null` (migración `add_field_code_rips`). |\n| `type_item_identifications` | `code_agency varchar(10) null`: el XML lo escribe como `schemeAgencyID`. |\n| `unit_measures`, `type_operations` | Códigos repetidos en el PHP (MGM, ONZ, PD y SO en unidades; 10 y 11 en operaciones, reusados por el documento soporte): índice no único `ix_<catalogo>_code` en lugar de `UQ`. |\n| `health_type_document_identifications` | solo forma base (Enterprise RIPS; se omite en la paridad Community). |\n| `credit_note_discrepancy_responses`, `debit_note_discrepancy_responses`, `credit_note_discrepancy_responses_sd` | solo forma base; tres tablas porque los códigos difieren por documento. |\n| `countries` | `code varchar(5)` (ISO). Índice no único: el PHP repetía `SI` en Suecia (id 218); la semilla lo corrige a `SE`, pero el índice no se vuelve único para no romper la paridad si aparece otro duplicado. |\n| `languages` | 185 pares de códigos que solo difieren en mayúsculas (`aa`/`AA`): índice no único, porque SQL Server y MySQL comparan sin distinguir mayúsculas. |\n| `departments` | `country_id int FK`, `code`. |\n| `municipalities` | `department_id int FK`, `code varchar(10)`, `codefacturador bigint null` (corregido en 8 migraciones PHP; se carga el valor final). `UQ (department_id, code)`. |\n\nNota: `type_environments` id 1 = producción, id 2 = habilitación (así lo usa `PUT /config/environment`).\n\n### 3.2 Plataforma e identidad (módulo `Identity`)\n\n```\nresellers                      — PHP: administrators\n  id uuid PK, identification_number varchar(20) UQ, dv char(1) null,\n  name varchar(255), address varchar(255) null, phone varchar(30) null,\n  email varchar(255) UQ, contact_name varchar(255) null, plan_label varchar(100) null,\n  is_active bool default true, observation varchar(500) null\n\nusers                          — ASP.NET Identity (AspNetUsers) con nombres snake_case\n  id uuid PK, email varchar(255) UQ(normalizado), password_hash varchar(500),\n  name varchar(255), phone varchar(30) null, reseller_id uuid null FK resellers,\n  is_active bool, email_confirmed bool, lockout_end ts null, access_failed_count int,\n  security_stamp varchar(100)\n  — SIN api_token, SIN mail_*: se movieron a api_keys y company_mail_settings\n\nroles                          — Identity. Semilla: platform_admin, reseller, owner, seller, customer\nuser_roles (user_id, role_id)  PK compuesta\n\nuser_companies                 — PHP: company_user\n  id uuid PK, user_id uuid FK, company_id uuid FK, role_id uuid FK roles,\n  customer_id uuid null      — solo para rol customer (portal del cliente)\n  UQ (user_id, company_id, role_id)\n\napi_keys\n  id uuid PK, company_id uuid null FK   — null = llave de plataforma (reemplaza X-Admin-Token)\n  name varchar(100), key_prefix varchar(12), key_hash char(64) UQ  — SHA-256 hex\n  scopes varchar(500)        — lista separada por coma: documents:write, documents:read, config:write, …\n  expires_at ts null, last_used_at ts null, revoked_at ts null, created_by uuid FK users\n  IX (company_id, revoked_at)\n\nrefresh_tokens\n  id uuid PK, user_id uuid FK, token_hash char(64) UQ, expires_at ts, revoked_at ts null,\n  replaced_by uuid null, created_ip varchar(45) null, user_agent varchar(300) null\n```\n\nReglas: la clave en claro se muestra una sola vez al crearla; solo se guarda `key_hash`. Una llave con `company_id` solo opera sobre esa empresa (la regla «el NIT debe pertenecer a la empresa del token» del manual).\n\n### 3.3 Empresa y configuración (módulo `Company`)\n\n```\ncompanies                      — PHP: companies (+ nombre/correo que vivían en users)\n  id uuid PK, reseller_id uuid null FK\n  identification_number varchar(20) UQ  — NIT sin DV, solo dígitos\n  dv char(1)\n  name varchar(255)            — razón social (en el PHP vive en users.name; confirmado en «php-rules»)\n  email varchar(255), phone varchar(30), address varchar(255)\n  merchant_registration varchar(50) null\n  language_id int FK, country_id int FK, municipality_id int FK\n  tax_id int FK, type_currency_id int FK, type_operation_id int FK\n  type_document_identification_id int FK, type_organization_id int FK,\n  type_regime_id int FK\n  storage_mode smallint null   — 0 local, 1 nube (migración add_storage_mode)\n  graphic_representation_template int default 2\n  allow_seller_login bool default false\n  is_active bool default true\n  — SIN password/newpassword, SIN type_plan*_id, SIN *_type_environment_id (van en tablas hijas)\n\ncompany_liabilities            — reemplaza type_liability_id + type_liability_ids (json)\n  company_id uuid FK, type_liability_id int FK    PK (company_id, type_liability_id)\n\ncompany_environments           — reemplaza 5 columnas *_type_environment_id\n  id uuid PK, company_id FK, document_kind smallint, type_environment_id int FK\n  UQ (company_id, document_kind)\n  document_kind: 1 factura/notas, 2 nómina, 3 documento equivalente, 4 documento soporte, 5 eventos\n\ncompany_software               — PHP: software (una fila con 5 juegos de columnas)\n  id uuid PK, company_id FK, document_kind smallint, type_environment_id int FK\n  software_identifier varchar(64), pin_cipher varchar(512)  — PIN cifrado\n  dian_url varchar(255), test_set_id varchar(64) null\n  UQ (company_id, document_kind, type_environment_id)\n\ncertificates\n  id uuid PK, company_id FK, name varchar(255)\n  secret_ref varchar(512)      — clave en Key Vault/Secrets Manager/Secret Manager o ruta cifrada\n  thumbprint varchar(64), subject varchar(500), issuer varchar(500)\n  not_before ts, not_after ts, is_active bool, uploaded_by uuid FK users\n  UQ filtrado ux_certificates_active (company_id) WHERE is_active = true\n  IX ix_certificates_not_after (not_after)   — alertas de vencimiento\n\nresolutions\n  id uuid PK, company_id FK, document_type_id int FK\n  type_environment_id int FK   — columna añadida tarde en el PHP; aquí obligatoria\n  prefix varchar(10) null, resolution_number varchar(50), resolution_date date\n  technical_key varchar(128) null, range_from bigint, range_to bigint\n  valid_from date null, valid_to date null, is_active bool\n  CK ck_resolutions_range (range_from <= range_to)\n  IX (company_id, document_type_id, type_environment_id, is_active)\n\ncompany_mail_settings\n  company_id uuid PK/FK, use_platform_default bool\n  host varchar(255) null, port int null, username varchar(255) null,\n  password_cipher varchar(512) null, encryption varchar(10) null,\n  from_address varchar(255) null, from_name varchar(255) null\n\ncompany_whatsapp_settings          — Enterprise (fase 8): no se crea en la migración inicial\n  company_id uuid PK/FK, url varchar(255) null, token_cipher varchar(512) null\n\ncompany_logos                  — una fila por empresa; el archivo va a blob\n  company_id uuid PK/FK, storage_key varchar(500), content_type varchar(100), updated_at ts\n```\n\nCifrado de `*_cipher`: ASP.NET Data Protection con llave en el proveedor de secretos (o llave maestra AES-GCM en instalaciones sin nube). Nunca se registran en logs ni en `audit_logs.changes`.\n\n### 3.4 Terceros y productos (módulo `Masters`)\n\n```\ncustomers                      — PHP: customers (la PK era el NIT; luego se agregó companies_id)\n  id uuid PK, company_id FK\n  identification_number varchar(20), dv char(1) null\n  type_document_identification_id int FK, name varchar(255)\n  phone varchar(30) null, address varchar(255) null, email varchar(255) null\n  municipality_id int null FK, type_organization_id int null FK,\n  type_regime_id int null FK, type_liability_id int null FK,\n  merchant_registration varchar(50) null, is_active bool default true, deleted_at ts null\n  UQ (company_id, id)           — destino de FKs compuestas\n  UQ (company_id, type_document_identification_id, identification_number)\n  — SIN password/newpassword (el portal usa Identity)\n  — Semilla por empresa: consumidor final (NIT 222222222222, tipo 13) al crear la empresa\n\nitems                          — PHP: items (solo el subconjunto Community)\n  id uuid PK, company_id FK, code varchar(100), name varchar(500),\n  description varchar(1000) null, unit_measure_id int FK, type_item_identification_id int FK,\n  sale_unit_price numeric(18,6), tax_id int null FK, is_active bool, deleted_at ts null\n  UQ (company_id, code)         — en PHP name e internal_id eran únicos GLOBALES (bug en multi-empresa)\n  — Stock, lotes, series, comisiones, imágenes: Enterprise (POS); no se crean en la paridad Community\n```\n\n### 3.5 Documentos (módulo `Documents`)\n\nEl núcleo. `documents` pasa de 77 columnas planas a una cabecera más tablas hijas.\n\n```\ndocuments\n  id uuid PK, company_id FK\n  document_type_id int FK type_documents\n  type_environment_id int FK         — ambiente en que se emitió\n  resolution_id uuid null FK         — null para nómina/soporte sin resolución\n  prefix varchar(10) not null default '', number bigint, full_number varchar(30)  — prefijo+número\n  status smallint not null           — enum DocumentStatus (sección 4)\n  cufe varchar(96) null              — CUFE, CUDE o CUNE según tipo\n  uuid_algorithm varchar(10) null    — CUFE-SHA384 / CUDE-SHA384 / CUDS-SHA384\n  issue_date date, issue_time time   — hora Colombia, tal como va en el XML\n  issued_at ts                       — mismo instante en UTC (consultas y orden)\n  customer_id uuid null              — FK compuesta (company_id, customer_id)\n  customer_snapshot json             — copia congelada: el XML depende de estos datos, no del cliente vivo\n  currency_id int FK, exchange_rate numeric(18,6) null\n  type_operation_id int null FK\n  line_extension_amount numeric(18,2), tax_exclusive_amount numeric(18,2),\n  tax_inclusive_amount numeric(18,2), allowance_total_amount numeric(18,2) default 0,\n  charge_total_amount numeric(18,2) default 0, prepaid_amount numeric(18,2) default 0,\n  payable_amount numeric(18,2)       — reemplaza sale/subtotal/total/total_discount/total_tax\n  reference_document_id uuid null    — nota -> documento original (FK compuesta)\n  discrepancy_code int null          — código de concepto de la nota (1,2,3…)\n  discrepancy_description varchar(500) null, notes varchar(2000) null\n  head_note varchar(2000) null, foot_note varchar(2000) null\n  track_id varchar(64) null, dian_status_code varchar(10) null,\n  dian_status_description varchar(500) null, sent_at ts null, accepted_at ts null\n  email_status smallint default 0, email_sent_at ts null\n  pdf_template_id int null\n  extensions json null               — exportación, AIU, mandato, transporte, contingencia\n  created_by_type smallint, created_by_id uuid null  — usuario o api key\n  deleted_at ts null                 — [verificar] sin uso mientras `Draft` no se persista; se elimina si la fase 2 no le encuentra uso\n  UQ ux_documents_number (company_id, document_type_id, type_environment_id, prefix, number)\n  UQ filtrado ux_documents_cufe (company_id, cufe) WHERE cufe IS NOT NULL\n  UQ (company_id, id)\n  IX ix_documents_company_issued (company_id, issued_at DESC)\n  IX ix_documents_company_status (company_id, status)\n  IX ix_documents_customer (company_id, customer_id, issued_at DESC)\n  IX ix_documents_track (track_id) WHERE track_id IS NOT NULL\n```\n\nNota sobre `ux_documents_number`: `prefix` puede ser NULL (documentos sin prefijo). Se guarda cadena vacía en vez de NULL cuando no hay prefijo, para que el único funcione igual en los tres motores.\n\n```\ndocument_lines\n  id uuid PK, company_id, document_id uuid FK(company_id, document_id)  — sin cascada (principio 6)\n  line_number int, code varchar(100) null, description varchar(500), notes varchar(1000) null\n  type_item_identification_id int FK, unit_measure_id int FK\n  quantity numeric(18,6), base_quantity numeric(18,6), unit_price numeric(18,6),\n  line_extension_amount numeric(18,2), free_of_charge bool, reference_price_id int null FK\n  extensions json null               — datos propios de la línea (AIU, transporte, mandato)\n  UQ (document_id, line_number)\n\ndocument_taxes                     — totales de impuesto de cabecera (tax_totals)\n  id uuid PK, company_id, document_id FK, tax_id int FK,\n  percent numeric(9,4) null, taxable_amount numeric(18,2), tax_amount numeric(18,2)\n  IX (document_id)\n\ndocument_line_taxes                — impuestos por línea\n  id uuid PK, company_id, document_id, line_id uuid FK, tax_id int FK,\n  percent numeric(9,4) null, taxable_amount numeric(18,2), tax_amount numeric(18,2),\n  per_unit_amount numeric(18,6) null, unit_measure_id int null FK\n  IX (line_id)\n\ndocument_allowance_charges         — descuentos y cargos (de cabecera si line_id es null)\n  id uuid PK, company_id, document_id FK, line_id uuid null FK,\n  charge_indicator bool, discount_id int null FK, reason varchar(500) null,\n  amount numeric(18,2), base_amount numeric(18,2), multiplier_factor numeric(9,4) null\n\ndocument_payments\n  id uuid PK, company_id, document_id FK, payment_form_id int FK,\n  payment_method_id int FK, due_date date null, duration_measure varchar(20) null\n\ndocument_references                — billing_reference, order_reference, etc.\n  id uuid PK, company_id, document_id FK, kind smallint,\n  number varchar(50) null, uuid varchar(96) null, issue_date date null\n\ndocument_files                     — sustituye xml/pdf/request_api/response_* de documents\n  id uuid PK, company_id, document_id FK, kind smallint, revision int default 1\n  storage_provider smallint, storage_key varchar(500), content_type varchar(100),\n  size_bytes bigint, sha256 char(64), created_at ts\n  kind: 1 xml firmado, 2 xml AttachedDocument, 3 pdf, 4 solicitud json,\n        5 respuesta DIAN, 6 zip enviado, 7 ApplicationResponse\n  UQ (document_id, kind, revision)\n\ndian_submissions                   — un registro por intento contra la DIAN\n  id uuid PK, company_id, document_id FK, attempt int, operation smallint\n  type_environment_id int, track_id varchar(64) null, zip_key varchar(64) null\n  http_status int null, dian_status_code varchar(10) null,\n  dian_status_description varchar(500) null, is_valid bool null,\n  error_messages json null, request_file_id uuid null, response_file_id uuid null\n  started_at ts, finished_at ts null, duration_ms int null\n  operation: 1 SendBillSync, 2 SendTestSetAsync, 3 GetStatus, 4 GetStatusZip, 5 SendEvent\n  UQ (document_id, attempt)  IX (track_id)\n\ndocument_events                    — eventos RADIAN emitidos o recibidos\n  — PHP: campos acu_recibo, rec_bienes, aceptacion, rechazo, cude_*, payload_* en documents y received_documents\n  id uuid PK, company_id, document_id uuid null FK, received_document_id uuid null FK\n  event_id int FK events, cude varchar(96), issued_at ts, track_id varchar(64) null\n  status smallint, dian_status_code varchar(10) null, payload_file_id uuid null\n  UQ (company_id, cude)  IX (document_id)  IX (received_document_id)\n  CK ck_document_events_target: exactamente uno de document_id / received_document_id no es nulo\n\nreceived_documents                 — facturas recibidas de proveedores\n  id uuid PK, company_id FK, supplier_identification_number varchar(20), supplier_dv char(1),\n  supplier_name varchar(255), document_type_id int FK, prefix varchar(10) not null default '',\n  number varchar(20), cufe varchar(96), issue_date date, type_environment_id int FK\n  line_extension_amount numeric(18,2), tax_exclusive_amount numeric(18,2),\n  allowance_total_amount numeric(18,2), tax_amount numeric(18,2), payable_amount numeric(18,2)\n  xml_file_key varchar(500) null, pdf_file_key varchar(500) null\n  UQ (company_id, cufe)  IX (company_id, issue_date DESC)  IX (company_id, supplier_identification_number)\n\nnumbering_sequences                — PHP: sends (consecutivo por resolución; ver scope_key)\n  id uuid PK, company_id FK, scope_key varchar(120), next_number bigint, row_version\n  UQ (company_id, scope_key)\n  scope_key = \"R:{resolution_id}\" cuando hay resolución, o \"T:{document_type_id}:{env}:{prefix}:{year}\" si no\n```\n\n### 3.6 Planes y consumo (módulo `Billing`)\n\n```\nplans                              — PHP: plans/type_plans\n  id int PK, name varchar(100) UQ, period smallint (0 default, 1 mensual, 2 anual, 3 paquete),\n  is_active bool, observations varchar(500) null\nplan_quotas                        — reemplaza qty_docs_invoice/payroll/radian/ds\n  plan_id int FK, document_kind smallint, quantity bigint     PK (plan_id, document_kind)\ncompany_plans                      — reemplaza type_plan_id .. type_plan4_id y start_plan_date*\n  id uuid PK, company_id FK, plan_id int FK, starts_at ts, ends_at ts null, is_active bool\n  IX (company_id, is_active)\nplan_usage                         — contador por plan y tipo; se incrementa al aceptar un documento\n  company_plan_id uuid FK, document_kind smallint, used bigint default 0, row_version\n  PK (company_plan_id, document_kind)\n```\n\nEl PHP guardaba `absolut_plan_documents` en `companies`; aquí el consumo vive en `plan_usage` y no se duplica.\n\n### 3.7 Operación y plataforma (módulo `Platform`)\n\n```\noutbox_messages\n  id uuid PK, company_id uuid null, type varchar(100), payload json,\n  status smallint (0 pendiente, 1 en proceso, 2 hecho, 3 fallido), attempts int default 0,\n  next_attempt_at ts, locked_by varchar(100) null, locked_until ts null,\n  last_error varchar(2000) null, created_at ts, processed_at ts null\n  IX (status, next_attempt_at)\n\naudit_logs\n  id bigint identity PK, company_id uuid null, actor_type smallint, actor_id uuid null,\n  action varchar(100), entity_type varchar(100), entity_id varchar(64) null,\n  correlation_id varchar(64) null, ip varchar(45) null, user_agent varchar(300) null,\n  changes json null  — nunca incluye secretos, created_at ts\n  IX (company_id, created_at DESC)  IX (entity_type, entity_id)\n\nnotifications\n  id uuid PK, company_id, user_id uuid null, type varchar(50), title varchar(200),\n  body varchar(1000), is_read bool default false, created_at ts\n  IX (company_id, user_id, is_read, created_at DESC)\n\nidempotency_keys                   — reintentos seguros de POST de documentos\n  id uuid PK, company_id, key varchar(100), request_hash char(64),\n  response_status int, response_body json null, created_at ts, expires_at ts\n  UQ (company_id, key)  IX (expires_at)\n\ndata_protection_keys               — llaves de ASP.NET Data Protection compartidas (ADR-25)\n  id int identity PK, friendly_name varchar(200) null, xml text  — cifrado por el proveedor de secretos\n```\n\nLa tabla `logs` del PHP (payload json por usuario) no se migra: la telemetría va a Serilog/OpenTelemetry y los cambios sensibles a `audit_logs`.\n\n## 4. Estados\n\n`DocumentStatus` (smallint):\n\n| Valor | Nombre | Significado |\n| --- | --- | --- |\n| 1 | `Received` | Solicitud validada y guardada, aún sin XML |\n| 2 | `Queued` | XML generado y firmado, mensaje en `outbox_messages` |\n| 3 | `Sent` | Enviado a la DIAN, hay `track_id`, falta respuesta |\n| 4 | `Accepted` | La DIAN validó sin observaciones |\n| 5 | `AcceptedWithWarnings` | Validado con notificaciones |\n| 6 | `Rejected` | La DIAN rechazó; se corrige y se emite de nuevo |\n| 7 | `Unconfirmed` | «Sin confirmar»: respuesta «En proceso» (98) o sin respuesta; se reconsulta cada minuto durante \\~10 min y luego cada 15 min hasta 24 h («Arquitectura detallada» sección 7) |\n| 8 | `Failed` | Error técnico tras agotar reintentos |\n| 9 | `ContingencyPending` | Emitido en contingencia, falta transmitir |\n| 10 | `Draft` | Vista previa (`preeliminar-view`): solo existe en memoria; nunca se persiste ni consume consecutivo |\n\nEl `state_document_id` del PHP no tiene catálogo: 0 = guardado o enviado sin validar (incluye los rechazados), 1 = validado por la DIAN, 2 = contingencia pendiente («php-rules», sección 6). Las respuestas legadas lo devuelven así: `Accepted` y `AcceptedWithWarnings` → 1; `ContingencyPending` → 2; el resto → 0. Se confirma con el contract test.\n\nTransiciones permitidas: `Received → {Queued, ContingencyPending, Failed}`; `Queued → {Sent, Failed}`; `ContingencyPending → Sent`; `Sent → {Accepted, AcceptedWithWarnings, Rejected, Unconfirmed}`; `Unconfirmed → {Accepted, AcceptedWithWarnings, Rejected, Failed}`. `Draft` no tiene transiciones porque no se persiste. Cualquier otra transición lanza un error de dominio.\n\n```mermaid\nstateDiagram-v2\n  [*] --> Received\n  Received --> Queued\n  Received --> ContingencyPending\n  Received --> Failed\n  Queued --> Sent\n  Queued --> Failed\n  ContingencyPending --> Sent\n  Sent --> Accepted\n  Sent --> AcceptedWithWarnings\n  Sent --> Rejected\n  Sent --> Unconfirmed\n  Unconfirmed --> Accepted\n  Unconfirmed --> AcceptedWithWarnings\n  Unconfirmed --> Rejected\n  Unconfirmed --> Failed\n```\n\n## 5. Consecutivos\n\nEs la operación más delicada: dos solicitudes simultáneas nunca pueden obtener el mismo número.\n\n1. Se toma el siguiente en una transacción corta, **antes** de generar el XML, con un solo `UPDATE` atómico sobre `numbering_sequences`.\n2. Si el cliente envía `number`, se valida contra `next_number` y el rango de la resolución; si no coincide se rechaza (el PHP solo lo validaba contra el rango y las fechas de la resolución, y aceptaba huecos y repetidos).\n3. El consecutivo consumido por un documento que terminó `Failed` no se reutiliza; se reporta en el panel como hueco.\n\n| Motor | Sentencia |\n| --- | --- |\n| PostgreSQL | `UPDATE numbering_sequences SET next_number = next_number + 1, row_version = row_version + 1 WHERE company_id = @c AND scope_key = @k RETURNING next_number - 1;` |\n| SQL Server | `UPDATE numbering_sequences SET next_number = next_number + 1, row_version = row_version + 1 OUTPUT inserted.next_number - 1 WHERE company_id = @c AND scope_key = @k;` |\n| MySQL | `UPDATE numbering_sequences SET next_number = LAST_INSERT_ID(next_number) + 1, row_version = row_version + 1 WHERE company_id = @c AND scope_key = @k; SELECT LAST_INSERT_ID();` (misma conexión) |\n\nUna clase por proveedor (`INumberingSql`) implementa esto; es SQL no portable y vive en `Infrastructure.<Proveedor>`.\n\n## 6. Consultas de lectura (Dapper) y índices que las sostienen\n\n| Consulta | Endpoint origen | Índice |\n| --- | --- | --- |\n| Listado paginado por rango de fechas y estado | `/information`, `/documents` | `ix_documents_company_issued`, `ix_documents_company_status` |\n| Totales por tipo y mes | `/total_documents`, `/information` | `ix_documents_company_issued` |\n| Buscar por CUFE | `status/document`, `load-document-by-cufe` | `ux_documents_cufe` |\n| Buscar por prefijo y número | `state_document`, `regenerate-attached-document` | `ux_documents_number` |\n| Pendientes por reconsultar | Worker | `ix_documents_company_status` con `status = 7` |\n| Siguiente consecutivo | `invoice/current_number` | PK/UQ de `numbering_sequences` |\n| Documentos de un cliente | panel | `ix_documents_customer` |\n| Certificados por vencer | alertas | `ix_certificates_not_after` |\n\nReglas: toda consulta Dapper incluye `company_id` en el `WHERE` (una prueba de arquitectura revisa que ninguna cadena SQL de lectura omita el parámetro); los listados grandes paginan por clave `(issued_at, id)` y no por `OFFSET`.\n\n## 7. Multi-tenant\n\n- Filtro global EF por `CompanyId` desde `ITenantContext` (resuelto de la API key o del JWT + empresa activa).\n- FKs compuestas `(company_id, X_id)` en `document_lines`, `document_taxes`, `document_files`, `dian_submissions`, `document_events` y desde `documents` hacia `customers` y `documents` (notas). Requiere `UQ (company_id, id)` en las tablas padre.\n- PostgreSQL: *row level security* opcional como segunda barrera (`current_setting('app.company_id')`); en SQL Server y MySQL la protección es el filtro de aplicación y la prueba de aislamiento.\n- Una prueba por cada entidad con `company_id`: crear datos en dos empresas y verificar que ninguna consulta cruza.\n- Los trabajos del Worker establecen el tenant del mensaje antes de abrir el `DbContext`.\n\n## 8. Diferencias por proveedor\n\n| Lógico | PostgreSQL | SQL Server | MySQL 8 |\n| --- | --- | --- | --- |\n| `uuid` | `uuid` | `uniqueidentifier` | `char(36)` (ascii) o `binary(16)`; se decide con ADR-08 y el proveedor elegido |\n| `ts` | `timestamptz` | `datetimeoffset(3)` | `datetime(6)` en UTC (no guarda offset) |\n| `bool` | `boolean` | `bit` | `tinyint(1)` |\n| `varchar(n)` | `varchar(n)` | `nvarchar(n)` | `varchar(n)` utf8mb4 |\n| `json` | `jsonb` | `nvarchar(max)` + `CHECK (ISJSON(col)=1)` | `json` |\n| `numeric(p,s)` | `numeric(p,s)` | `decimal(p,s)` | `decimal(p,s)` |\n| `bigint identity` | `bigint generated always as identity` | `bigint identity` | `bigint auto_increment` |\n| Cola de mensajes | `FOR UPDATE SKIP LOCKED` | `WITH (UPDLOCK, READPAST, ROWLOCK)` | `FOR UPDATE SKIP LOCKED` |\n\nTrampas a resolver en la implementación:\n\n1. **Índices únicos con NULL.** `ux_documents_cufe` y `ux_certificates_active` necesitan filtro. PostgreSQL y SQL Server soportan índice parcial/filtrado. **SQL Server trata los NULL como valores iguales** en un único índice normal, así que sin `WHERE cufe IS NOT NULL` solo permitiría un documento sin CUFE. En MySQL no hay índices parciales: `ux_documents_cufe (company_id, cufe)` funciona porque permite varios NULL, y `ux_certificates_active` se implementa con una columna generada `active_company_id` (igual a `company_id` si `is_active`, si no NULL) con índice único.\n2. **Longitud de clave en MySQL (utf8mb4).** Índices sobre `varchar` largos pueden pasar el límite de 3072 bytes. Las columnas ASCII (`cufe`, `track_id`, `scope_key`, `key_prefix`) se definen `ascii`/`ascii_bin`.\n3. **Collation.** Se evita depender de ella (sección 2, texto normalizado). PostgreSQL compara con distinción de mayúsculas y SQL Server/MySQL sin ella por defecto; los datos normalizados dan el mismo comportamiento.\n4. **Longitud de identificadores.** PostgreSQL 63 y MySQL 64 caracteres: los nombres de índice `ix_*`/`fk_*` se abrevian con una función única de la convención.\n5. **`DateTimeOffset`.** MySQL no guarda offset; el convertidor normaliza a UTC al escribir y devuelve `DateTimeOffset` con offset 0.\n6. **JSON.** Un solo `ValueConverter` serializa con `System.Text.Json` y opciones fijas; no se consultan campos JSON con SQL en ningún motor.\n7. **Decimales.** Precisión y escala explícitas en cada propiedad; EF no debe quedar con el valor por defecto de cada proveedor.\n8. **Aislamiento.** `READ COMMITTED` en los tres; SQL Server con `READ_COMMITTED_SNAPSHOT ON`.\n9. **Carga de catálogos.** `municipalities` (≈1.100 filas) se siembra en lotes con `MigrationBuilder`; no se usa `LOAD DATA` ni `BULK INSERT`.\n\n## 9. Migraciones, semillas y proyectos\n\n```\nsrc/ImpiFact.Infrastructure/              DbContext único, configuraciones por entidad (IEntityTypeConfiguration)\nsrc/ImpiFact.Infrastructure.Postgres/     migraciones + SQL específico (INumberingSql, cola)\nsrc/ImpiFact.Infrastructure.SqlServer/\nsrc/ImpiFact.Infrastructure.MySql/\nsrc/ImpiFact.Infrastructure/Seed/*.json   catálogos versionados (id, code, name, …)\n```\n\n- El proveedor se elige por `Database:Provider` (IOptions con `ValidateOnStart`) y `Database:ConnectionString`.\n- Migraciones: `dotnet ef migrations add <Nombre> -p ImpiFact.Infrastructure.<Proveedor>`, generadas **por proveedor**, nunca copiadas a mano entre ellos. CI falla si el modelo y el snapshot de algún proveedor difieren.\n- Aplicación: herramienta de consola `ImpiFact.Migrator` o el flag `--migrate` del Api en desarrollo; en producción se generan scripts idempotentes (`dotnet ef migrations script --idempotent`).\n- Semillas: los JSON de `Seed/` se generan **una vez** extrayendo los `insert` de las migraciones PHP (con sus ids) y se corrigen con los valores finales (nombres de impuestos, `codefacturador`). Un test compara cada catálogo sembrado contra su JSON y falla si cambia un `id` o un `code`.\n- Cambios futuros de catálogo (nuevo anexo DIAN) = nueva migración de datos con `valid_from`; nunca se edita una fila existente.\n- Semilla de plataforma: roles, planes base y tipos de ambiente. Por empresa, al crearla: cliente consumidor final.\n\n## 10. Mapeo PHP → .NET\n\n| PHP | .NET | Cambio |\n| --- | --- | --- |\n| `users` | `users` + `api_keys` + `company_mail_settings` | Separa identidad, llaves y correo |\n| `administrators` | `resellers` | Renombre |\n| `company_user` | `user_companies` | Agrega rol |\n| `companies` | `companies` + `company_liabilities` + `company_environments` + `company_plans` | Normaliza columnas repetidas |\n| `software` | `company_software` | Una fila por tipo de documento y ambiente; PIN cifrado |\n| `certificates` | `certificates` | Solo referencia al secreto, huella y vigencia |\n| `resolutions` | `resolutions` | Ambiente obligatorio, rango validado |\n| `sends` | `numbering_sequences` | Clave por resolución; atómico |\n| `customers` | `customers` | PK uuid, único por empresa, sin contraseña |\n| `items` | `items` | Único por empresa; sin campos POS |\n| `documents` | `documents` + hijas + `document_files` + `dian_submissions` | Descompone las 77 columnas |\n| `received_documents` | `received_documents` + `document_events` | Eventos aparte |\n| `type_plans`/`plans` | `plans` + `plan_quotas` + `company_plans` + `plan_usage` | Normaliza |\n| `whatsapp_configs` | `company_whatsapp_settings` | Por empresa, no por usuario; Enterprise (fase 8) |\n| `logs` | `audit_logs` + Serilog | Cambia de propósito |\n| `password_resets` | Identity | Lo da el framework |\n| \\~30 tablas de catálogo | igual nombre | Con ids originales y vigencia |\n\n## 11. Criterios de aceptación del modelo\n\nEl modelo se da por terminado cuando (en la fase 2 se exige solo en PostgreSQL; en SQL Server y MySQL, en la fase 6):\n\n1. Las migraciones de los tres proveedores se aplican en limpio desde Testcontainers y el snapshot de cada uno coincide con el modelo.\n2. Una prueba compara las tablas físicas de los tres motores contra esta especificación (nombres, nulabilidad, precisión de `numeric`).\n3. Los catálogos sembrados coinciden id por id con los JSON de `Seed/`.\n4. La prueba de aislamiento multi-tenant pasa para cada entidad con `company_id`.\n5. La prueba de concurrencia de consecutivos (100 tareas paralelas por resolución) no produce duplicados ni huecos en los tres motores.\n6. `ux_documents_number` y `ux_documents_cufe` impiden duplicados y permiten varios documentos sin CUFE en los tres motores.\n7. Ningún secreto en claro aparece en la base: una prueba revisa `company_software`, `company_mail_settings` y `api_keys` (y `company_whatsapp_settings` cuando llegue con Enterprise).\n8. Los golden tests de la fase 3 persisten y recuperan un documento completo (cabecera, líneas, impuestos, archivos, envíos) sin pérdida de decimales.\n\nResueltos el 14-nov en «php-rules»: razón social, mapeo de `state_document_id` y validación del `number`. Sigue pendiente **\\[verificar\\]**: el tipo de UUID en MySQL según el proveedor elegido (ADR-08).\n"}, {"id": "frontend", "label": "Frontend", "file": "Arquitectura frontend.md", "markdown": "# Arquitectura del frontend (Angular)\n\nEspecificación de implementación del panel `web/`. Complementa la sección 10 de la pestaña «Arquitectura detallada», que queda como resumen; ante cualquier diferencia manda este documento. Las versiones exactas de Angular y de las librerías se fijan al crear el proyecto con la última versión estable y se registran en `package.json`.\n\n## 1. ¿Microfrontends? No\n\n**Decisión (ADR-15): un solo panel Angular, modular por *features*, sin microfrontends.**\n\nPor qué:\n\n1. Hay un solo desarrollador y un solo despliegue. Los microfrontends resuelven un problema de **equipos independientes que despliegan por separado**; aquí solo agregarían Module Federation, versiones compartidas de Angular y un *shell* extra por mantener.\n2. Los módulos del panel comparten sesión, empresa activa, permisos y navegación. Separarlos obliga a sincronizar ese estado entre aplicaciones.\n3. El backend ya es un monolito modular; un frontend distribuido frente a un backend único no aporta aislamiento real.\n4. Rendimiento: la carga perezosa de rutas ya da lo que se busca (el usuario descarga solo lo que usa).\n\nQué se hace en su lugar, para poder separar después sin reescribir: cada *feature* vive en su propia **librería del workspace** con fronteras de importación verificadas por lint. Si Enterprise crece con equipos propios (nómina, POS, RIPS), esa librería se extrae como remoto de Module Federation o como app aparte. Criterio para reabrir la decisión: más de dos equipos tocando el panel, o módulos que deban desplegarse con ritmo distinto.\n\n## 2. Workspace\n\nAngular CLI con librerías (sin Nx por ahora; migrar a Nx si el número de librerías lo justifica).\n\n```\nweb/\n├─ projects/\n│  ├─ app/                       aplicación: bootstrap, rutas raíz, shell (layout, menú)\n│  ├─ core/                      lib: auth, sesión, empresa activa, interceptores, guards, config, errores\n│  ├─ ui/                        lib: componentes de presentación sin lógica de negocio\n│  ├─ api/                       lib: cliente generado desde OpenAPI (no se edita a mano)\n│  ├─ feature-auth/\n│  ├─ feature-companies/\n│  ├─ feature-production-wizard/\n│  ├─ feature-documents/\n│  ├─ feature-masters/           clientes y productos\n│  ├─ feature-api-keys/\n│  ├─ feature-plans/\n│  ├─ feature-platform/          reseller y administrador de plataforma\n│  └─ feature-notifications/\n├─ e2e/                          Playwright\n├─ eslint.config.js  tsconfig.base.json  package.json\n```\n\nReglas de dependencia (se hacen cumplir con `eslint-plugin-boundaries` o `no-restricted-imports`):\n\n| Desde | Puede importar | No puede importar |\n| --- | --- | --- |\n| `app` | todo | — |\n| `feature-*` | `core`, `ui`, `api` | otro `feature-*` (se comunican por rutas o por servicios de `core`) |\n| `ui` | nada del workspace | `core`, `api`, `feature-*` |\n| `core` | `api` | `ui`, `feature-*` |\n| `api` | nada | todo lo demás |\n\n## 3. Capas dentro de cada *feature*\n\n```\nfeature-documents/src/lib/\n├─ pages/            componentes de ruta (\"smart\"): leen estado, orquestan, navegan\n├─ components/       componentes de presentación del feature (\"dumb\"): inputs/outputs, sin servicios\n├─ state/            servicios con signals (store del feature)\n├─ forms/            builders de formularios tipados y validadores\n├─ models/           tipos propios del feature (solo si no los da `api`)\n└─ documents.routes.ts   rutas perezosas del feature (export default)\n```\n\n- Componentes *standalone* con `ChangeDetectionStrategy.OnPush`; `inject()` en vez de constructores; entradas y salidas con las funciones de *signals* (`input()`, `output()`, `model()`).\n- Plantillas con *control flow* nativo (`@if`, `@for` con `track`, `@switch`) y `@defer` para bloques pesados (visor de PDF, gráficos).\n- Detección de cambios sin Zone.js (*zoneless*) si la versión de Angular lo marca estable; si no, `OnPush` + signals.\n- Un archivo por componente, nombres `kebab-case` con sufijo de rol (`document-list.page.ts`, `tax-summary.component.ts`).\n\n## 4. Estado\n\n- **Estado de servidor** (listas, detalles): servicios del feature con `signal`/`computed` y llamadas al cliente generado. Patrón: `state.loading()`, `state.error()`, `state.data()`; refresco explícito tras mutaciones.\n- **Estado de UI** local: signals dentro del componente.\n- **Estado global mínimo** en `core`: sesión (usuario, roles), empresa activa, preferencias, notificaciones.\n- No se usa NgRx al inicio (ADR-16): el estado es mayormente de servidor y local. Se reabre si aparece estado compartido complejo (por ejemplo, un POS Enterprise con carrito offline).\n- Persistencia en el navegador: solo preferencias no sensibles (tema, densidad, última empresa) en `localStorage`. Nada de tokens ni datos fiscales.\n\n## 5. Cliente de API\n\n- Se **genera** desde el OpenAPI que publica el Api con un generador que produzca servicios de Angular sobre `HttpClient` (`ng-openapi-gen` u OpenAPI Generator `typescript-angular`), para que pasen por los interceptores. Se descarta `openapi-fetch` por saltarse `HttpClient`.\n- Script `npm run api:generate` descarga `openapi.json`, regenera `projects/api` y falla en CI si hay diferencias sin commitear (el contrato no puede divergir en silencio).\n- Nombres con typos heredados del contrato JSON (`integral_salarary`, `seze`) se conservan en los tipos generados; los formularios los mapean a nombres limpios en `forms/`.\n- Manejo de errores centralizado: un interceptor convierte `ProblemDetails` en un `AppError` con `code`, `message`, `fieldErrors` y `correlationId`; los formularios muestran `fieldErrors` junto al campo y el resto sale en un *toast* con el `correlationId` copiable.\n\n## 6. Autenticación y seguridad en el cliente\n\n| Tema | Decisión |\n| --- | --- |\n| Token de acceso | JWT de 15 min, **solo en memoria** (un signal en `core`), nunca en `localStorage` |\n| Refresh | Cookie `HttpOnly; Secure; SameSite=Strict` emitida por el Api; el cliente llama a `/auth/refresh` con `withCredentials` al arrancar y ante un 401 |\n| Interceptores | `authInterceptor` (adjunta Bearer), `refreshInterceptor` (un solo refresh en vuelo; reintenta una vez), `errorInterceptor`, `correlationInterceptor` (`X-Correlation-Id`) |\n| Guards | `authGuard` (sesión), `roleGuard(roles)`, `companyGuard` (empresa activa elegida), `unsavedChangesGuard` |\n| Permisos en UI | Se leen de los claims y ocultan o deshabilitan acciones; **el backend es la autoridad**, nunca se confía en el cliente |\n| XSS | Sin `innerHTML` ni `bypassSecurityTrust*` salvo en un wrapper revisado (`SafeHtml` solo para el PDF/XML renderizado); plantillas Angular escapan por defecto |\n| CSP | Cabeceras en el servidor estático: `default-src 'self'`, sin `unsafe-inline` (estilos con *nonce* o hash), `frame-ancestors 'none'`, `connect-src` solo el Api |\n| Secretos | Ninguno en el bundle. API keys se muestran una vez con botón de copiar y se borran del estado al cerrar el diálogo |\n| Certificado `.pfx` | Se sube por `multipart` directo al Api; la clave se escribe en un campo `type=password`, no se guarda en estado ni en logs del cliente |\n| Cierre de sesión | Llama a `/auth/logout` (revoca el refresh), limpia estado y redirige; sincroniza entre pestañas con `BroadcastChannel` |\n| Inactividad | Aviso a los 25 min y cierre a los 30 (configurable) |\n\nCambio requerido en el backend: el endpoint de refresh debe aceptar y emitir la cookie `HttpOnly`, y CORS debe permitir credenciales para el origen del panel. Se agrega a las tareas de la fase 2.\n\n## 7. Mapa de rutas y roles\n\n| Ruta | Feature | Roles |\n| --- | --- | --- |\n| `/login`, `/recuperar` | `feature-auth` | público |\n| `/empresas/seleccionar` | `feature-auth` | todos los autenticados |\n| `/` (tablero) | `app` | owner, seller |\n| `/empresas/:id/{datos,ambientes,software,certificado,resoluciones,correo,logo,plantilla}` | `feature-companies` | owner |\n| `/empresas/:id/produccion` | `feature-production-wizard` | owner |\n| `/documentos`, `/documentos/nuevo`, `/documentos/:id` | `feature-documents` | owner, seller (`nuevo`: con alcance de emisión) |\n| `/clientes`, `/productos` | `feature-masters` | owner, seller |\n| `/llaves-api` | `feature-api-keys` | owner |\n| `/plan` | `feature-plans` | owner |\n| `/plataforma/{empresas,planes,revendedores}` | `feature-platform` | reseller, platform\\_admin |\n| `/notificaciones` | `feature-notifications` | todos |\n| `/portal` (documentos del cliente) | `feature-documents` (vista restringida) | customer |\n\nTodas las rutas de feature son perezosas (`loadChildren`). El menú lateral se construye desde un arreglo de configuración filtrado por rol.\n\n## 8. Pantallas críticas\n\n### 8.1 Emisión de documento (`/documentos/nuevo`)\n\nEs la pantalla más compleja y no puede duplicar el redondeo del backend.\n\n- Formulario tipado con secciones: tipo de documento, cliente (búsqueda o alta rápida), pago, líneas (tabla editable), descuentos/cargos, notas.\n- Los totales e impuestos **no se calculan en el cliente**: el panel llama a un endpoint de cálculo del Api (`POST /api/v1/documents/calculate`, que usa `DianRounding`) y muestra el resultado; el envío final reutiliza esos valores. Así el CUFE no depende de aritmética de JavaScript. Es una tarea nueva del backend (fase 3).\n- Botón «Vista previa» (`preeliminar-view`) abre el PDF sin consumir consecutivo; «Emitir» envía con `Idempotency-Key` generado al abrir el formulario.\n- Tras emitir, la pantalla de detalle sigue el estado (sección 9).\n\n### 8.2 Asistente de paso a producción\n\nPasos con estado persistido en el servidor (empresa → certificado → resolución → set de pruebas → producción por producto). Cada paso valida con el Api antes de habilitar el siguiente; un paso completado puede reabrirse. Mensajes de error de la DIAN se muestran con su explicación en español.\n\n### 8.3 Listado de documentos\n\nPaginación y orden en el servidor (por clave `issued_at, id`), filtros por fecha, tipo, estado y cliente guardados en la URL (compartibles), exportación CSV desde el Api, acciones por fila: ver, XML, PDF, reenviar correo, regenerar PDF, enviar evento.\n\n## 9. Estado en tiempo real\n\n- Detalle de documento: *polling* con retroceso (2 s, 4 s, 8 s hasta 30 s) mientras el estado sea `Queued`, `Sent` o `Unconfirmed`; se detiene con un estado final o al salir de la pantalla.\n- Notificaciones (campana): *polling* cada 60 s. Si se requiere inmediatez se agrega SSE en el Api (`/api/v1/events`) sin cambiar los componentes, porque ambos alimentan el mismo servicio de `core`.\n- Todo *polling* se cancela con `takeUntilDestroyed` y se pausa si la pestaña está oculta.\n\n## 10. Sistema de diseño y UX\n\n- Librería de componentes: **Optimus UI (@openng/optimus-ui, fork comunitario de PrimeNG)** (ADR-17), por que PrimeNG 22 (Angular 22 en adelante) dejó la licencia MIT y exige licencia comunitaria con requisitos o comercial por desarrollador, mientras Optimus UI conserva la línea abierta y el catálogo (tabla, árbol, calendario, carga de archivos). Es un proyecto joven: antes de comprometerse se verifica licencia, ritmo de mantenimiento, soporte de la versión de Angular elegida y accesibilidad (spike en la tarea 4 del backlog). Los componentes propios de `ui` envuelven a Optimus UI para poder cambiarlo si el proyecto se estanca.\n- *Design tokens* (colores, tipografía, espaciado, radios, densidad) como variables CSS en un solo archivo; modo claro y oscuro.\n- Datos: tablas con cabecera fija y paginación servidor, estados vacíos, de carga (esqueletos) y de error con acción de reintento en todas las listas.\n- Accesibilidad WCAG 2.2 AA: foco visible, navegación por teclado, etiquetas en todos los campos, contraste verificado, anuncios con `aria-live` para toasts y cambios de estado.\n- Idioma y formato: español de Colombia (`es-CO`) como base; moneda COP con 2 decimales y separadores locales; fechas `YYYY-MM-DD` en entrada hacia la DIAN y formato local en pantalla. Textos con `@angular/localize` o Transloco (ADR-18) desde el primer día, sin cadenas fijas en las plantillas.\n- Responsive: diseño *mobile-first*; el panel completo es usable en tablet, y las pantallas de consulta (listado, detalle, descarga) en móvil.\n\n## 11. Rendimiento\n\n- Rutas perezosas por feature; `@defer` para visor de PDF y gráficos; precarga de rutas frecuentes (`withPreloading`).\n- Presupuestos de *bundle* en `angular.json`: inicial ≤ 500 kB y falla el *build* al superarlos; cualquier feature perezoso ≤ 250 kB.\n- Imágenes con `NgOptimizedImage`; PDFs y XML descargados como blob, nunca incrustados en el estado.\n- Metas: LCP ≤ 2,5 s y INP ≤ 200 ms en 4G simulado; medidas con Lighthouse CI en el pipeline.\n\n## 12. Pruebas\n\n| Nivel | Herramienta | Qué cubre |\n| --- | --- | --- |\n| Unitarias | Ejecutor por defecto de la CLI vigente + *Testing Library* | Servicios de estado, validadores, *pipes*, componentes de presentación |\n| Componentes | Testing Library con selectores por rol y etiqueta | Interacción de formularios y tablas |\n| E2E | Playwright | Login, selección de empresa, alta de empresa, emisión de factura (contra Api con DIAN simulada), descarga de PDF, revocar API key |\n| Contrato | Regeneración del cliente en CI | Falla si el OpenAPI cambia sin actualizar `projects/api` |\n| Accesibilidad | `axe-core` en Playwright | Sin violaciones graves en las pantallas principales |\n| V
