# OpenTelemetry Collector sidecar for the api and worker tasks (AWS).
# The app exports OTLP/gRPC to 127.0.0.1:4317 (OTEL_EXPORTER_OTLP_ENDPOINT); the collector sends traces to X-Ray,
# metrics to CloudWatch (embedded metric format, namespace ImpiFact) and logs to CloudWatch Logs, with the task role.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

exporters:
  awsxray:
    region: ${env:AWS_REGION}
  awsemf:
    region: ${env:AWS_REGION}
    namespace: ImpiFact
    log_group_name: ${env:OTEL_METRICS_LOG_GROUP}
    dimension_rollup_option: NoDimensionRollup
  awscloudwatchlogs:
    region: ${env:AWS_REGION}
    log_group_name: ${env:OTEL_LOGS_LOG_GROUP}
    log_stream_name: otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [awsemf]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [awscloudwatchlogs]
