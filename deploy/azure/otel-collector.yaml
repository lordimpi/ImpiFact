# OpenTelemetry Collector sidecar for the api and worker container apps (Azure).
# The app exports OTLP/gRPC to 127.0.0.1:4317 (OTEL_EXPORTER_OTLP_ENDPOINT); the collector forwards traces, metrics
# and logs to Application Insights. The connection string arrives as a Container Apps secret, never in this file.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

exporters:
  azuremonitor:
    connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [azuremonitor]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [azuremonitor]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [azuremonitor]
