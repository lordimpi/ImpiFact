# Servicios para desarrollo local (Arquitectura detallada, sección 13).
# Uso, desde la raíz del repositorio:
#   1. Crear deploy/.env (no se versiona) con una línea:  POSTGRES_PASSWORD=<una contraseña propia>
#   2. docker compose -f deploy/docker-compose.yml up -d
#
# Los puertos quedan atados a 127.0.0.1: solo se puede entrar desde este mismo equipo.
# MinIO (almacenamiento compatible con S3) va en el perfil «s3»; ver el servicio más abajo.
# Gotenberg (HTML a PDF) y MailHog (correo de prueba) arrancan con los demás; ver sus servicios más abajo.
# El panel de observabilidad (registros, trazas y métricas por OTLP) va en el perfil «observability».
# SQL Server (Database:Provider = SqlServer) va en el perfil «sqlserver»; ver el servicio más abajo.
# MySQL (Database:Provider = MySql) va en el perfil «mysql» (necesita MYSQL_PASSWORD en deploy/.env); ver el servicio más abajo.
# La aplicación (Migrator, Api, Worker y panel) construida desde este repositorio va en el perfil «app»; ver sus servicios más abajo.
name: impifact

# Configuración común del Migrator, la API y el Worker del perfil «app» (ver sus servicios más abajo). Sin secretos en
# el archivo: la contraseña sale de deploy/.env y la llave maestra es un secreto montado.
x-impifact-backend-env: &impifact-backend-env
  ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Production}
  DOTNET_ENVIRONMENT: ${APP_ENVIRONMENT:-Production}
  Database__Provider: Postgres
  # GSS Encryption Mode=Disable: sin él, Npgsql busca la librería de Kerberos (libgssapi_krb5), que la imagen de .NET
  # no trae, y escribe un error al abrir la primera conexión; la base usa usuario y contraseña.
  Database__ConnectionString: Host=postgres;Port=5432;Database=impifact;Username=impifact;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
  Secrets__Provider: LocalAesGcm
  Secrets__LocalAesGcm__MasterKeyFile: /run/secrets/master_key
  Storage__Provider: Local
  Pdf__GotenbergUrl: http://gotenberg:3000

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: impifact
      POSTGRES_USER: impifact
      # Sale de deploy/.env, que no se versiona. Docker se niega a arrancar si falta.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    ports:
      # POSTGRES_PORT en deploy/.env cambia el puerto del equipo, por ejemplo si ya hay un PostgreSQL instalado en 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Desde PostgreSQL 18 la imagen guarda los datos en una subcarpeta por versión dentro de esta ruta.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impifact -d impifact"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SQL Server 2022 para probar Database:Provider = SqlServer en desarrollo. Va en el perfil «sqlserver», así que solo
  # arranca con:  docker compose -f deploy/docker-compose.yml --profile sqlserver up -d sqlserver
  # Necesita en deploy/.env:
  #   MSSQL_SA_PASSWORD=<contraseña propia: 8 caracteres o más, con mayúsculas, minúsculas, dígitos y símbolos>
  # Sin ella (o con una débil) SQL Server no arranca y lo dice en «docker compose logs sqlserver». La aplicación y el
  # Migrator usan Database__Provider=SqlServer y
  #   Database__ConnectionString=Server=127.0.0.1,1433;Database=impifact;User Id=sa;Password=<la misma>;TrustServerCertificate=True
  # El Migrator crea la base «impifact» si no existe y le aplica las migraciones de ImpiFact.Infrastructure.SqlServer.
  # Edición Developer: gratis solo para desarrollo y pruebas, nunca en producción. La imagen pide unos 2 GB de memoria.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sqlserver"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Sale de deploy/.env, que no se versiona. Vacía, SQL Server se niega a arrancar (nunca usa una de fábrica).
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
    ports:
      # MSSQL_PORT en deploy/.env cambia el puerto del equipo, por ejemplo si ya hay un SQL Server instalado en 1433.
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # «$$» llega como «$» al contenedor: la contraseña se lee allí, no al armar el compose. -C confía en el
      # certificado propio del servidor.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # MySQL 8.4 (la versión LTS) para probar Database:Provider = MySql en desarrollo. Va en el perfil «mysql», así que
  # solo arranca con:  docker compose -f deploy/docker-compose.yml --profile mysql up -d mysql
  # Necesita en deploy/.env:  MYSQL_PASSWORD=<una contraseña propia>  (la del usuario impifact, dueño de la base
  # impifact). La clave de root se genera al azar y queda solo en el registro del primer arranque: no hace falta.
  # La aplicación se conecta con
  #   Database__Provider=MySql
  #   Database__ConnectionString=Server=127.0.0.1;Port=3306;Database=impifact;User ID=impifact;Password=<MYSQL_PASSWORD>
  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: impifact
      MYSQL_USER: impifact
      # Sale de deploy/.env, que no se versiona. Sin ella el contenedor no arranca (ver entrypoint); no se exige con «:?»
      # porque Docker Compose lee todo el archivo y fallaría también sin el perfil «mysql».
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    # «$$» llega como «$» al contenedor: la variable se lee allí, no al armar el compose.
    entrypoint:
      - sh
      - -c
      - >-
        if [ -z "$$MYSQL_PASSWORD" ]; then echo "Set MYSQL_PASSWORD in deploy/.env" >&2; exit 1; fi;
        exec docker-entrypoint.sh mysqld
    ports:
      # MYSQL_PORT en deploy/.env cambia el puerto del equipo, por ejemplo si ya hay un MySQL instalado en 3306.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Por TCP: durante la carga inicial el servidor no escucha en la red, así que solo responde cuando está listo.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO: almacenamiento de objetos compatible con S3 (el de Amazon) para probar Storage:Provider = S3 en desarrollo.
  # Va en el perfil «s3», así que solo arranca con:  docker compose -f deploy/docker-compose.yml --profile s3 up -d
  # Necesita en deploy/.env:
  #   MINIO_ROOT_USER=<usuario propio>
  #   MINIO_ROOT_PASSWORD=<contraseña propia, 8 caracteres o más>
  #   MINIO_KMS_SECRET_KEY=impifact-dev:<base64 de 32 bytes al azar, por ejemplo de «openssl rand -base64 32»>
  # La llave KMS (servicio de administración de llaves) permite el cifrado del lado del servidor (SSE-S3) que la
  # aplicación pide al guardar. Sin estas variables MinIO no arranca (nunca usa su usuario y contraseña de fábrica).
  # La aplicación toma sus credenciales de AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY (los mismos valores), nunca de
  # appsettings. MinIO dejó de publicar imágenes oficiales en 2025; esta es la del fork comunitario, con la versión fija.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    profiles: ["s3"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-}
    # «$$» llega como «$» al contenedor: las variables se leen allí, no al armar el compose.
    entrypoint:
      - sh
      - -c
      - >-
        if [ -z "$$MINIO_ROOT_USER" ] || [ -z "$$MINIO_ROOT_PASSWORD" ] || [ -z "$$MINIO_KMS_SECRET_KEY" ]; then
        echo "Set MINIO_ROOT_USER, MINIO_ROOT_PASSWORD and MINIO_KMS_SECRET_KEY in deploy/.env" >&2; exit 1; fi;
        exec minio server /data --console-address :9001
    ports:
      # API S3 (Storage:S3:ServiceUrl = http://127.0.0.1:9000) y consola web de MinIO.
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Crea el bucket (MINIO_BUCKET, por omisión «impifact-documents») una vez que MinIO está listo; la aplicación no
  # crea buckets.
  minio-bucket:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-impifact-documents}
    entrypoint:
      - sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    restart: "no"

  # Conversor de HTML a PDF del Worker (ADR-04): Chromium detrás de una API HTTP, sin estado ni secretos.
  # La variante «-chromium» no trae LibreOffice, que el PDF no usa. Las pruebas de integración usan la misma imagen.
  gotenberg:
    image: gotenberg/gotenberg:8.39.0-chromium
    ports:
      # El Worker usa Pdf:GotenbergUrl = http://127.0.0.1:3000 (o http://gotenberg:3000 dentro de esta red).
      - "127.0.0.1:${GOTENBERG_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
  # Capturador de correo de desarrollo: recibe por SMTP todo lo que envía el Worker y no lo entrega a nadie. Los
  # correos se ven en http://127.0.0.1:8025. Para usarlo, el Worker lleva Email__Host=127.0.0.1, Email__Port=1025,
  # Email__Encryption=none y Email__FromAddress=<un remitente de prueba>.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025"

  # ─── Aplicación (perfil «app») ─────────────────────────────────────────────────────────────────────────────────────
  # El Migrator, la API, el Worker y el panel construidos desde este repositorio (Dockerfile.migrator, Dockerfile.api,
  # Dockerfile.worker y Dockerfile.web; Arquitectura detallada, sección 14), contra el PostgreSQL, Gotenberg y MailHog de
  # este archivo. Arrancan, desde la raíz, con:
  #   docker compose -f deploy/docker-compose.yml --profile app up -d --build
  # El Migrator corre primero (migrate: migraciones y catálogos DIAN) y la API y el Worker arrancan cuando termina bien.
  # Panel en http://127.0.0.1:8180, API en http://127.0.0.1:5180 y salud del Worker en http://127.0.0.1:8191/health/live.
  # Necesita en deploy/.env, además de POSTGRES_PASSWORD (sin «;» ni comillas, porque va dentro de la cadena de conexión):
  #   JWT_SIGNING_KEY="-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----"
  #     Llave privada ECDSA P-256 en PEM con «\n» en lugar de los saltos de línea, entre comillas dobles. Se crea con
  #     openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt
  #   IMPIFACT_MASTER_KEY_FILE=<ruta del archivo de la llave maestra>   (por omisión ../.local/master.key, la de «Correr
  #     en local» del README; relativa a esta carpeta). Llega al contenedor como secreto en /run/secrets/master_key; en
  #     Linux el usuario del contenedor (uid 1654) tiene que poder leerlo.
  # Opcionales: API_PORT, WEB_PORT y WORKER_HEALTH_PORT (los puertos del equipo), APP_ENVIRONMENT (Production por omisión;
  # Development abre Scalar en /scalar) y APP_EMAIL_FROM (remitente de los correos que captura MailHog).
  # Los archivos y certificados quedan en el volumen app-data. Comandos del Migrator:
  #   docker compose -f deploy/docker-compose.yml --profile app run --rm migrator create-platform-key <nombre>
  #   docker compose -f deploy/docker-compose.yml --profile app run --rm migrator seed-demo --force
  migrator:
    image: impifact-migrator:local
    build:
      context: ../backend
      dockerfile: ../Dockerfile.migrator
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *impifact-backend-env
    secrets:
      - master_key
    volumes:
      - app-data:/data
    restart: "no"

  api:
    image: impifact-api:local
    build:
      context: ../backend
      dockerfile: ../Dockerfile.api
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      gotenberg:
        condition: service_started
    environment:
      <<: *impifact-backend-env
      # Secreto: obligatorio fuera de Development; sin él la API no arranca y lo dice en su registro.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      # El panel llama a la API desde otro puerto (otro origen): CORS con credenciales solo para él.
      Cors__Origins__0: http://127.0.0.1:${WEB_PORT:-8180}
    secrets:
      - master_key
    volumes:
      - app-data:/data
    ports:
      - "127.0.0.1:${API_PORT:-5180}:8080"

  worker:
    image: impifact-worker:local
    build:
      context: ../backend
      dockerfile: ../Dockerfile.worker
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      gotenberg:
        condition: service_started
      mailhog:
        condition: service_started
    environment:
      <<: *impifact-backend-env
      # Enlaces de los correos (restablecer la contraseña) hacia el panel de este archivo.
      Panel__BaseUrl: http://127.0.0.1:${WEB_PORT:-8180}
      Email__Host: mailhog
      Email__Port: "1025"
      Email__Encryption: none
      Email__FromAddress: ${APP_EMAIL_FROM:-no-reply@impifact.local}
      # La imagen ya escucha en 0.0.0.0 (WorkerHealth__Host): la sonda y el puerto publicado llegan desde fuera.
    secrets:
      - master_key
    volumes:
      - app-data:/data
    ports:
      - "127.0.0.1:${WORKER_HEALTH_PORT:-8191}:8091"

  web:
    image: impifact-web:local
    build:
      context: ../web
      dockerfile: ../Dockerfile.web
    profiles: ["app"]
    environment:
      # URL de la API que usa el navegador (config.json y connect-src de la política de seguridad de contenido).
      IMPIFACT_API_BASE_URL: http://127.0.0.1:${API_PORT:-5180}
    ports:
      - "127.0.0.1:${WEB_PORT:-8180}:8080"

  # Panel de observabilidad local (.NET Aspire Dashboard; Arquitectura detallada, sección 12): recibe OTLP y muestra los
  # registros, las trazas y las métricas de la API y del Worker. Va en el perfil «observability», así que solo arranca
  # con:  docker compose -f deploy/docker-compose.yml --profile observability up -d aspire-dashboard
  # La API y el Worker le mandan datos solo si llevan OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4317 (sin esa
  # variable no exportan nada). El panel queda en http://127.0.0.1:18888; pide el enlace con la llave de acceso que
  # escribe al arrancar:  docker compose -f deploy/docker-compose.yml logs aspire-dashboard
  # Guarda todo en memoria: al detenerlo se pierde.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-18888}:18888"
      # OTLP por gRPC y por HTTP en los puertos estándar del equipo (4317 y 4318).
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:18889"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:18890"

volumes:
  # Archivos y certificados de la API, el Worker y el Migrator del perfil «app».
  app-data:
  postgres-data:
  mysql-data:
  minio-data:
  sqlserver-data:

secrets:
  # Llave maestra de LocalAesGcm para el perfil «app»: 32 bytes al azar en base64 (openssl rand -base64 32).
  master_key:
    file: ${IMPIFACT_MASTER_KEY_FILE:-../.local/master.key}
